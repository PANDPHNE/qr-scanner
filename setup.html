<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scanner setup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0C241B">

<style>

/* THEME · DEEP GREEN — same tokens as the scanner screen */
:root {
  --bg: #0C241B;
  --surf: #12321F;
  --surf2: #173D29;
  --line: #21503A;
  --ink: #F3ECE3;
  --soft: #A9BBAF;
  --faint: #6F8A7B;
  --accent: #6BF04A;
  --accent-ink: #0C241B;
  --ok-bg: #174A2C;  --ok: #8DF27A;
  --bad-bg: #4C1E17; --bad: #FFA593;
  --info: #9FD2FF;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  font-family: Onest, Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

.container { width: 100%; max-width: 520px; margin: 0 auto; }

.header { margin: 4px 2px 20px; }
.header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 0; }
.header p { margin: 6px 0 0; color: var(--soft); font-size: 14px; line-height: 1.45; }

.card {
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 18px;
  margin-bottom: 16px;
}

.section-title { font-size: 17px; font-weight: 800; margin-bottom: 18px; }

.field { margin-bottom: 18px; }

label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--soft);
}

input[type="url"],
select {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  padding: 0 14px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

input[type="url"]::placeholder { color: var(--faint); }

input[type="url"]:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(107,240,74,.15);
}

button {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 14px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

button:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: not-allowed; }

.primary { background: var(--accent); color: var(--accent-ink); }
.secondary { background: var(--surf2); color: var(--ink); border: 1px solid var(--line); }

.checkbox-row { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
.checkbox-row input[type="checkbox"] { width: 20px; height: 20px; min-width: 20px; accent-color: var(--accent); }
.checkbox-row label { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink); }

.small-note { margin-top: 7px; color: var(--faint); font-size: 12px; line-height: 1.5; }

#nameRuleNote { color: var(--soft); }
#nameRuleNote strong { color: var(--ink); }

.hidden { display: none !important; }

.status { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 14px; }
.status.success { display: block; background: var(--ok-bg); border: 1px solid var(--line); color: var(--ok); }
.status.error { display: block; background: var(--bad-bg); border: 1px solid #6B2A20; color: var(--bad); }

.status-title { font-weight: 800; margin-bottom: 6px; }

.destination-details { font-size: 13px; line-height: 1.7; color: var(--ink); opacity: .85; }
.destination-details strong { color: var(--ink); }

#startScanning { display: none; margin-top: 16px; }
#loadSheets[data-sheet-loaded="true"] { background: var(--surf2); color: var(--ink); border: 1px solid var(--line); }
#changeDestination { display: none; margin-top: 10px; }

.loading { opacity: .7; }

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>Scanner setup</h1>

    <p>Choose the logbook tab this phone scans into.</p>

  </div>


  <div class="card">

    <div class="section-title">Where scans go</div>


    <!-- GOOGLE SHEET -->

    <div
      id="spreadsheetField"
      class="field"
    >

      <label for="spreadsheetUrl">Google Sheet link</label>

      <input
        id="spreadsheetUrl"
        type="url"
        placeholder="Paste Google Sheet link"
        autocomplete="off"
      >

      <div class="small-note">
        Paste the Google Sheet that will receive
        successful scans.
      </div>

    </div>


    <button
      id="loadSheets"
      class="primary"
    >
      Load tabs
    </button>


    <!-- SHEET TAB -->

    <div
      id="sheetField"
      class="field hidden"
      style="margin-top:18px;"
    >

      <label for="sheetName">Tab</label>

      <select id="sheetName">

        <option value="">
          Choose a tab
        </option>

      </select>

    </div>


    <!-- COLUMNS -->

    <div
      id="columnField"
      class="hidden"
    >


      <!-- ITEM CODE -->

      <div class="field">

        <label for="itemCodeColumn">Item code column</label>

        <select id="itemCodeColumn">

          <option value="">
            Choose a column
          </option>

        </select>

      </div>


      <!-- TIMESTAMP -->

      <div class="checkbox-row">

        <input
          id="timestampEnabled"
          type="checkbox"
          checked
        >

        <label for="timestampEnabled">
          Add timestamp for every successful scan
        </label>

      </div>


      <div
        id="timestampField"
        class="field"
      >

        <label for="timestampColumn">Timestamp column</label>

        <select id="timestampColumn">

          <option value="">
            Choose a column
          </option>

        </select>

      </div>


      <!-- SCANNER NAME (who scanned). The OWNER decides per tab in the logbook's BOXES tab
           (column H): REQUIRED / NOT ALLOWED lock this; STAFF CHOOSES lets the phone pick. -->

      <div class="checkbox-row">
        <input id="nameEnabled" type="checkbox">
        <label for="nameEnabled">Save the name of the staff who scanned</label>
      </div>

      <div id="nameField" class="field hidden">
        <label for="nameColumn">Staff name column</label>
        <select id="nameColumn">
          <option value="">Choose a column</option>
        </select>
      </div>

      <p id="nameRuleNote" style="margin:4px 0 12px;font-size:14px;line-height:1.4;"></p>


      <!-- SAVE -->

      <button
        id="saveDestination"
        class="primary"
      >
        Save
      </button>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >

      <div
        id="statusTitle"
        class="status-title"
      ></div>

      <div
        id="statusDetails"
        class="destination-details"
      ></div>

    </div>


    <!-- Start scanning -->

    <button
      id="startScanning"
      class="primary"
    >
      Start scanning
    </button>


    <!-- Change tab -->

    <button
      id="changeDestination"
      class="secondary"
    >
      Change tab
    </button>

  </div>

</div>


<script>

/************************************************************
 * ==========================================================
 * APPS SCRIPT WEB APP
 * ==========================================================
 */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbw5UNZLFYecKu-uh0_6mI1QsyyTXlmBb9OfVCYs-c3vTtbKawphBD0ClrFy1fVExmpo/exec';


/************************************************************
 * ==========================================================
 * ELEMENTS
 * ==========================================================
 */

const spreadsheetField =
  document.getElementById(
    'spreadsheetField'
  );

const spreadsheetUrl =
  document.getElementById(
    'spreadsheetUrl'
  );

const loadSheetsButton =
  document.getElementById(
    'loadSheets'
  );

const sheetField =
  document.getElementById(
    'sheetField'
  );

const sheetName =
  document.getElementById(
    'sheetName'
  );

const columnField =
  document.getElementById(
    'columnField'
  );

const itemCodeColumn =
  document.getElementById(
    'itemCodeColumn'
  );

const timestampEnabled =
  document.getElementById(
    'timestampEnabled'
  );

const timestampField =
  document.getElementById(
    'timestampField'
  );

const timestampColumn =
  document.getElementById(
    'timestampColumn'
  );

const nameEnabled =
  document.getElementById(
    'nameEnabled'
  );

const nameField =
  document.getElementById(
    'nameField'
  );

const nameColumn =
  document.getElementById(
    'nameColumn'
  );

const nameRuleNote =
  document.getElementById(
    'nameRuleNote'
  );

/*
 * The owner's rule for the selected tab (from the server):
 * { rule: REQUIRED | NOT ALLOWED | STAFF CHOOSES, locked, letter, byLetter }.
 */
let nameRule = null;

function applyNameRule(plan) {

  nameRule = plan || null;

  const locked = !!(plan && plan.locked);

  nameEnabled.disabled = locked;
  nameColumn.disabled = locked;

  if (plan && plan.rule === 'REQUIRED') {
    nameEnabled.checked = true;
    nameColumn.value = plan.columnNumber ? String(plan.columnNumber) : '';
  }

  if (plan && plan.rule === 'NOT ALLOWED') {
    nameEnabled.checked = false;
    nameColumn.value = '';
  }

  nameField.classList.toggle('hidden', !nameEnabled.checked);

  nameRuleNote.innerHTML =
    !plan ? ''
    : plan.rule === 'REQUIRED'
      ? '🔒 Set by the owner: the staff name is <strong>always</strong> saved in column <strong>' +
        escapeHtml(plan.letter || '?') + '</strong>' +
        (plan.byLetter && plan.byLetter !== plan.letter ? ' and in BY (column ' + escapeHtml(plan.byLetter) + ')' : '') +
        '. It cannot be turned off here.'
    : plan.rule === 'NOT ALLOWED'
      ? '🔒 Set by the owner: names are <strong>not</strong> saved on this tab.'
    : 'The owner lets you choose: tick to save the staff name and pick the column.' +
      (plan.byLetter ? ' BY (column ' + escapeHtml(plan.byLetter) + ') always gets the name.' : '');

}

const saveDestinationButton =
  document.getElementById(
    'saveDestination'
  );

const status =
  document.getElementById(
    'status'
  );

const statusTitle =
  document.getElementById(
    'statusTitle'
  );

const statusDetails =
  document.getElementById(
    'statusDetails'
  );

const startScanningButton =
  document.getElementById(
    'startScanning'
  );

const changeDestinationButton =
  document.getElementById(
    'changeDestination'
  );


/************************************************************
 * ==========================================================
 * JSONP REQUEST
 * ==========================================================
 *
 * Allows this GitHub page to communicate with
 * Google Apps Script.
 *
 ************************************************************/

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'scannerCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                'The Apps Script backend did not respond.'
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        delete window[
          callbackName
        ];

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[
        callbackName
      ] = function(data) {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        resolve(
          data
        );

      };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              'Could not connect to the Apps Script backend.'
            )
          );

        };


      const separator =
        url.includes('?')
          ? '&'
          : '?';


      script.src =
        url +
        separator +
        'callback=' +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/************************************************************
 * ==========================================================
 * LOAD EXISTING VERIFIED DESTINATION
 * ==========================================================
 *
 * If the user returns to Setup from the scanner,
 * show the existing verified destination first.
 *
 * The saved destination is NOT modified here.
 *
 ************************************************************/

loadExistingDestination();


function loadExistingDestination() {

  const raw =
    localStorage.getItem(
      'qrScannerDestination'
    );


  if (!raw) {

    return;

  }


  try {

    const destination =
      JSON.parse(
        raw
      );


    if (
      !destination ||
      !destination.spreadsheetUrl ||
      !destination.sheetName ||
      !destination.itemCodeColumn
    ) {

      return;

    }


    /*
     * Show the current verified destination.
     */

    spreadsheetField
      .classList
      .add(
        'hidden'
      );

    loadSheetsButton.style.display =
      'none';

    sheetField
      .classList
      .add(
        'hidden'
      );

    columnField
      .classList
      .add(
        'hidden'
      );


    status.className =
      'status success';


    statusTitle.textContent =
      'Ready to scan';


    let html =

      'Spreadsheet: <strong>' +
      'Saved Google Sheet' +
      '</strong><br>' +

      'Tab: <strong>' +
      escapeHtml(
        destination.sheetName
      ) +
      '</strong><br>' +

      'Item code: <strong>Column ' +
      escapeHtml(
        columnNumberToLetter(
          destination.itemCodeColumn
        )
      ) +
      '</strong>';


    if (
      destination.timestampEnabled
    ) {

      html +=

        '<br>Timestamp: <strong>Column ' +
        escapeHtml(
          columnNumberToLetter(
            destination.timestampColumn
          )
        ) +
        '</strong>';

    }

    else {

      html +=
        '<br>Timestamp: <strong>OFF</strong>';

    }


    html +=
      destination.nameRule === 'REQUIRED'
        ? '<br>Staff name: <strong>REQUIRED by the owner' + (destination.nameLetter ? ' (column ' + escapeHtml(destination.nameLetter) + ')' : '') + '</strong>'
      : destination.nameRule === 'NOT ALLOWED'
        ? '<br>Staff name: <strong>NOT ALLOWED by the owner</strong>'
      : destination.nameEnabled && destination.nameColumn
        ? '<br>Staff name: <strong>Column ' + escapeHtml(columnNumberToLetter(destination.nameColumn)) + '</strong>'
        : '<br>Staff name: <strong>OFF</strong>';


    statusDetails.innerHTML =
      html;


    startScanningButton.style.display =
      'block';

    changeDestinationButton.style.display =
      'block';

  }

  catch(error) {

    console.error(
      'SAVED DESTINATION READ ERROR:',
      error
    );

  }

}


/************************************************************
 * ==========================================================
 * Change tab
 * ==========================================================
 *
 * IMPORTANT:
 *
 * This does NOT erase the currently verified
 * destination.
 *
 * It simply loads that destination into the
 * setup controls for editing.
 *
 ************************************************************/

changeDestinationButton.addEventListener(
  'click',
  async function() {

    const raw =
      localStorage.getItem(
        'qrScannerDestination'
      );


    if (!raw) {

      return;

    }


    let destination;


    try {

      destination =
        JSON.parse(
          raw
        );

    }

    catch(error) {

      showError(
        'The saved destination could not be read.'
      );

      return;

    }


    /*
     * Hide the ready-state buttons while editing.
     */

    startScanningButton.style.display =
      'none';

    changeDestinationButton.style.display =
      'none';


    /*
     * Restore the saved Sheet Link.
     */

    spreadsheetUrl.value =
      destination.spreadsheetUrl;


    /*
     * The spreadsheet is already loaded.
     *
     * Therefore this button becomes:
     *
     * Change sheet link
     */

    loadSheetsButton.textContent =
      'Change sheet link';

    loadSheetsButton.dataset.sheetLoaded =
      'true';

    loadSheetsButton.style.display =
      'block';


    spreadsheetField
      .classList
      .remove(
        'hidden'
      );


    try {

      /*
       * Reload Sheet Tabs.
       *
       * This uses the EXISTING sheets endpoint.
       */

      const response =
        await jsonp(

          APPS_SCRIPT_URL +
          '?action=sheets' +
          '&spreadsheetUrl=' +
          encodeURIComponent(
            destination.spreadsheetUrl
          )

        );


      if (
        !response ||
        response.success !== true
      ) {

        throw new Error(

          response &&
          response.error

            ? response.error

            : 'Unable to reload the saved sheet.'

        );

      }


      sheetName.innerHTML =
        '<option value="">Choose a tab</option>';


      if (
        !Array.isArray(
          response.sheets
        )
      ) {

        throw new Error(
          'No sheet tabs were returned.'
        );

      }


      response.sheets.forEach(
        function(sheet) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            sheet.name;

          option.textContent =
            sheet.name;

          sheetName.appendChild(
            option
          );

        }
      );


      /*
       * Restore Sheet Tab.
       */

      sheetName.value =
        destination.sheetName;


      sheetField
        .classList
        .remove(
          'hidden'
        );


      /*
       * Reload columns for the saved Sheet Tab.
       */

      const columnResponse =
        await jsonp(

          APPS_SCRIPT_URL +
          '?action=columns' +
          '&spreadsheetUrl=' +
          encodeURIComponent(
            destination.spreadsheetUrl
          ) +
          '&sheetName=' +
          encodeURIComponent(
            destination.sheetName
          )

        );


      if (
        !columnResponse ||
        columnResponse.success !== true
      ) {

        throw new Error(

          columnResponse &&
          columnResponse.error

            ? columnResponse.error

            : 'Unable to reload columns.'

        );

      }


      populateColumns(
        columnResponse.columns
      );


      /*
       * Restore Item Code.
       */

      itemCodeColumn.value =
        String(
          destination.itemCodeColumn
        );


      /*
       * Restore Timestamp state.
       */

      timestampEnabled.checked =
        Boolean(
          destination.timestampEnabled
        );


      if (
        destination.timestampEnabled
      ) {

        timestampField
          .classList
          .remove(
            'hidden'
          );


        timestampColumn.value =
          String(
            destination.timestampColumn || ''
          );

      }

      else {

        timestampField
          .classList
          .add(
            'hidden'
          );


        timestampColumn.value =
          '';

      }


      /*
       * Restore Scanner Name state.
       * (Destinations saved before this option existed
       * start with it ON and no column picked.)
       */

      nameEnabled.checked =
        destination.nameEnabled === true;

      nameField.classList.toggle(
        'hidden',
        !nameEnabled.checked
      );

      nameColumn.value =
        nameEnabled.checked && destination.nameColumn
          ? String(destination.nameColumn)
          : '';

      applyNameRule(columnResponse.scannerName);


      columnField
        .classList
        .remove(
          'hidden'
        );


      status.className =
        'status success';


      statusTitle.textContent =
        'Edit where scans go';


      statusDetails.textContent =
        'Your current destination is loaded. Change only the settings you need, then select Save.';

    }

    catch(error) {

      console.error(
        'CHANGE DESTINATION ERROR:',
        error
      );


      showError(
        error.message
      );

    }

  }
);


/************************************************************
 * ==========================================================
 * Load tabs / Change sheet link
 * ==========================================================
 */

loadSheetsButton.addEventListener(
  'click',
  async function() {


    /*
     * If the spreadsheet is already loaded,
     * this button means Change sheet link.
     *
     * IMPORTANT:
     *
     * The verified qrScannerDestination is NOT
     * deleted here.
     */

    if (
      loadSheetsButton.dataset.sheetLoaded ===
      'true'
    ) {

      spreadsheetUrl.value =
        '';


      sheetName.innerHTML =
        '<option value="">Choose a tab</option>';


      itemCodeColumn.innerHTML =
        '<option value="">Choose a column</option>';


      timestampColumn.innerHTML =
        '<option value="">Choose a column</option>';


      nameColumn.innerHTML =
        '<option value="">Choose a column</option>';


      sheetField
        .classList
        .add(
          'hidden'
        );


      columnField
        .classList
        .add(
          'hidden'
        );


      loadSheetsButton.textContent =
        'Load tabs';

      loadSheetsButton.dataset.sheetLoaded =
        'false';


      timestampEnabled.checked =
        true;


      timestampField
        .classList
        .remove(
          'hidden'
        );


      nameEnabled.checked =
        false;

      nameField.classList.add(
        'hidden'
      );


      hideStatus();


      spreadsheetUrl.focus();


      return;

    }


    const url =
      spreadsheetUrl.value.trim();


    if (!url) {

      showError(
        'Please enter the Google Sheet link.'
      );

      return;

    }


    setButtonLoading(
      loadSheetsButton,
      'Loading tabs…'
    );


    try {

      /*
       * EXISTING APPS SCRIPT REQUEST.
       *
       * No backend change.
       */

      const response =
        await jsonp(

          APPS_SCRIPT_URL +
          '?action=sheets' +
          '&spreadsheetUrl=' +
          encodeURIComponent(
            url
          )

        );


      if (
        !response ||
        response.success !== true
      ) {

        throw new Error(

          response &&
          response.error

            ? response.error

            : 'Unable to load sheet tabs.'

        );

      }


      sheetName.innerHTML =
        '<option value="">Choose a tab</option>';


      if (
        !Array.isArray(
          response.sheets
        )
      ) {

        throw new Error(
          'No sheet tabs were returned.'
        );

      }


      response.sheets.forEach(
        function(sheet) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            sheet.name;

          option.textContent =
            sheet.name;

          sheetName.appendChild(
            option
          );

        }
      );


      /*
       * The Sheet Link successfully loaded.
       *
       * The button now means Change sheet link.
       */

      loadSheetsButton.textContent =
        'Change sheet link';

      loadSheetsButton.dataset.sheetLoaded =
        'true';


      sheetField
        .classList
        .remove(
          'hidden'
        );


      columnField
        .classList
        .add(
          'hidden'
        );


      hideStatus();

    }

    catch(error) {

      showError(
        error.message
      );

    }

    finally {

      if (
        loadSheetsButton.dataset.sheetLoaded !==
        'true'
      ) {

        resetButton(
          loadSheetsButton,
          'Load tabs'
        );

      }

      else {

        loadSheetsButton.disabled =
          false;

        loadSheetsButton.classList.remove(
          'loading'
        );

      }

    }

  }
);


/************************************************************
 * ==========================================================
 * WHEN SHEET TAB IS SELECTED
 * ==========================================================
 */

sheetName.addEventListener(
  'change',
  async function() {

    const url =
      spreadsheetUrl.value.trim();

    const selectedSheet =
      sheetName.value;


    if (
      !url ||
      !selectedSheet
    ) {

      columnField
        .classList
        .add(
          'hidden'
        );

      return;

    }


    columnField
      .classList
      .add(
        'hidden'
      );


    try {

      /*
       * EXISTING APPS SCRIPT REQUEST.
       *
       * No backend change.
       */

      const response =
        await jsonp(

          APPS_SCRIPT_URL +
          '?action=columns' +
          '&spreadsheetUrl=' +
          encodeURIComponent(
            url
          ) +
          '&sheetName=' +
          encodeURIComponent(
            selectedSheet
          )

        );


      if (
        !response ||
        response.success !== true
      ) {

        throw new Error(

          response &&
          response.error

            ? response.error

            : 'Unable to load columns.'

        );

      }


      populateColumns(
        response.columns
      );


      columnField
        .classList
        .remove(
          'hidden'
        );


      /*
       * The Sheet Tab changed.
       *
       * Column choices must be selected again
       * because they belong to the selected tab.
       */

      itemCodeColumn.value =
        '';

      timestampColumn.value =
        '';

      nameColumn.value =
        '';

      nameEnabled.checked =
        false;

      applyNameRule(response.scannerName);


      hideStatus();

    }

    catch(error) {

      showError(
        error.message
      );

    }

  }
);


/************************************************************
 * ==========================================================
 * POPULATE COLUMN DROPDOWNS
 * ==========================================================
 */

function populateColumns(
  columns
) {

  itemCodeColumn.innerHTML =
    '<option value="">Choose a column</option>';

  timestampColumn.innerHTML =
    '<option value="">Choose a column</option>';

  nameColumn.innerHTML =
    '<option value="">Choose a column</option>';


  if (
    !Array.isArray(
      columns
    )
  ) {

    return;

  }


  columns.forEach(
    function(column) {

      const headerText =
        column.header
          ? column.header
          : 'Column ' +
            column.letter;


      const label =
        column.letter +
        ' — ' +
        headerText;


      const itemOption =
        document.createElement(
          'option'
        );

      itemOption.value =
        column.columnNumber;

      itemOption.textContent =
        label;


      itemCodeColumn.appendChild(
        itemOption
      );


      const timestampOption =
        document.createElement(
          'option'
        );

      timestampOption.value =
        column.columnNumber;

      timestampOption.textContent =
        label;


      timestampColumn.appendChild(
        timestampOption
      );


      const nameOption =
        document.createElement(
          'option'
        );

      nameOption.value =
        column.columnNumber;

      nameOption.textContent =
        label;

      nameColumn.appendChild(
        nameOption
      );

    }
  );

}


/************************************************************
 * ==========================================================
 * TIMESTAMP CHECKBOX
 * ==========================================================
 */

timestampEnabled.addEventListener(
  'change',
  function() {

    if (
      timestampEnabled.checked
    ) {

      timestampField
        .classList
        .remove(
          'hidden'
        );

    }

    else {

      timestampField
        .classList
        .add(
          'hidden'
        );

      timestampColumn.value =
        '';

    }

  }
);


/************************************************************
 * ==========================================================
 * SCANNER NAME CHECKBOX
 * ==========================================================
 */

nameEnabled.addEventListener(
  'change',
  function() {

    nameField.classList.toggle(
      'hidden',
      !nameEnabled.checked
    );

    if (!nameEnabled.checked) {
      nameColumn.value = '';
    }

  }
);


/************************************************************
 * ==========================================================
 * SAVE / VERIFY DESTINATION
 * ==========================================================
 */

saveDestinationButton.addEventListener(
  'click',
  async function() {

    const url =
      spreadsheetUrl.value.trim();

    const selectedSheet =
      sheetName.value;

    const selectedItemColumn =
      itemCodeColumn.value;

    const useTimestamp =
      timestampEnabled.checked;

    const selectedTimestampColumn =
      timestampColumn.value;

    const useName =
      !(nameRule && nameRule.locked) && nameEnabled.checked; // a locked rule is enforced by the server

    const selectedNameColumn =
      nameColumn.value;


    if (!url) {

      showError(
        'Please enter the Google Sheet link.'
      );

      return;

    }


    if (!selectedSheet) {

      showError(
        'Please select a Sheet Tab.'
      );

      return;

    }


    if (!selectedItemColumn) {

      showError(
        'Please select the Item Code column.'
      );

      return;

    }


    if (
      useTimestamp &&
      !selectedTimestampColumn
    ) {

      showError(
        'Please select the Timestamp column.'
      );

      return;

    }


    if (
      useTimestamp &&
      selectedItemColumn ===
      selectedTimestampColumn
    ) {

      showError(
        'Item Code and Timestamp must use different columns.'
      );

      return;

    }


    if (
      useName &&
      !selectedNameColumn
    ) {

      showError(
        'Please select the Scanner Name column.'
      );

      return;

    }


    if (
      useName &&
      (
        selectedNameColumn === selectedItemColumn ||
        (useTimestamp && selectedNameColumn === selectedTimestampColumn)
      )
    ) {

      showError(
        'Scanner Name must use its own column (not the Item Code or Timestamp column).'
      );

      return;

    }


    setButtonLoading(
      saveDestinationButton,
      'Checking…'
    );


    try {

      /*
       * EXISTING VERIFY DESTINATION REQUEST.
       *
       * Do not change the endpoint or parameters.
       */

      const query =

        APPS_SCRIPT_URL +

        '?action=verifyDestination' +

        '&spreadsheetUrl=' +
        encodeURIComponent(
          url
        ) +

        '&sheetName=' +
        encodeURIComponent(
          selectedSheet
        ) +

        '&itemCodeColumn=' +
        encodeURIComponent(
          selectedItemColumn
        ) +

        '&timestampEnabled=' +
        encodeURIComponent(
          useTimestamp
        );


      let finalQuery =
        query;


      if (
        useTimestamp
      ) {

        finalQuery +=

          '&timestampColumn=' +
          encodeURIComponent(
            selectedTimestampColumn
          );

      }


      if (
        useName
      ) {

        finalQuery +=

          '&nameColumn=' +
          encodeURIComponent(
            selectedNameColumn
          );

      }


      const response =
        await jsonp(
          finalQuery
        );


      if (
        !response ||
        response.success !== true ||
        response.valid !== true
      ) {

        throw new Error(

          response &&
          response.error

            ? response.error

            : 'Destination verification failed.'

        );

      }


      /*
       * IMPORTANT:
       *
       * Preserve the existing destination
       * storage structure.
       */

      localStorage.setItem(

        'qrScannerDestination',

        JSON.stringify({

          spreadsheetUrl:
            url,

          sheetName:
            selectedSheet,

          itemCodeColumn:
            Number(
              selectedItemColumn
            ),

          timestampEnabled:
            useTimestamp,

          timestampColumn:

            useTimestamp

              ? Number(
                  selectedTimestampColumn
                )

              : null,

          nameEnabled:
            useName,

          nameColumn:
            useName
              ? Number(selectedNameColumn)
              : null,

          nameRule:
            nameRule ? nameRule.rule : '',

          nameLetter:
            nameRule && nameRule.locked ? (nameRule.letter || '') : ''

        })

      );


      /*
       * Show the Destination Ready state.
       */

      showSuccess(
        response
      );

    }

    catch(error) {

      showError(
        error.message
      );

    }

    finally {

      resetButton(
        saveDestinationButton,
        'Save'
      );

    }

  }
);


/************************************************************
 * ==========================================================
 * Start scanning
 * ==========================================================
 *
 * Keep the existing scanner handoff.
 *
 ************************************************************/

startScanningButton.addEventListener(
  'click',
  function() {

    window.location.href =
      'index.html';

  }
);


/************************************************************
 * ==========================================================
 * SUCCESS MESSAGE
 * ==========================================================
 */

function showSuccess(
  response
) {

  /*
   * Once the destination is verified,
   * switch to the clean Destination Ready state.
   */

  spreadsheetField
    .classList
    .add(
      'hidden'
    );

  loadSheetsButton.style.display =
    'none';

  sheetField
    .classList
    .add(
      'hidden'
    );

  columnField
    .classList
    .add(
      'hidden'
    );


  status.className =
    'status success';


  statusTitle.textContent =
    'Ready to scan';


  let html =

    'Spreadsheet: <strong>' +
    escapeHtml(
      response.spreadsheetName
    ) +
    '</strong><br>' +

    'Tab: <strong>' +
    escapeHtml(
      response.sheetName
    ) +
    '</strong><br>' +

    'Item code: <strong>' +
    escapeHtml(
      response.itemCode.letter
    ) +
    '</strong>';


  if (
    response.timestamp &&
    response.timestamp.enabled
  ) {

    html +=

      '<br>Timestamp: <strong>' +
      escapeHtml(
        response.timestamp.letter
      ) +
      '</strong>';

  }

  else {

    html +=
      '<br>Timestamp: <strong>OFF</strong>';

  }


  if (
    response.scannerName &&
    response.scannerName.enabled
  ) {

    html +=

      '<br>Staff name: <strong>' +
      escapeHtml(
        response.scannerName.letter
      ) +
      '</strong>';

  }

  else {

    html +=
      '<br>Staff name: <strong>OFF</strong>';

  }


  statusDetails.innerHTML =
    html;


  /*
   * Both actions are now available.
   */

  startScanningButton.style.display =
    'block';

  changeDestinationButton.style.display =
    'block';

}


/************************************************************
 * ==========================================================
 * ERROR MESSAGE
 * ==========================================================
 */

function showError(
  message
) {

  status.className =
    'status error';


  statusTitle.textContent =
    'Not ready yet';


  statusDetails.textContent =
    message;


  startScanningButton.style.display =
    'none';

  changeDestinationButton.style.display =
    'none';

}


/************************************************************
 * ==========================================================
 * HIDE STATUS
 * ==========================================================
 */

function hideStatus() {

  status.className =
    'status';


  statusTitle.textContent =
    '';


  statusDetails.textContent =
    '';


  startScanningButton.style.display =
    'none';

  changeDestinationButton.style.display =
    'none';

}


/************************************************************
 * ==========================================================
 * COLUMN NUMBER → LETTER
 * ==========================================================
 *
 * Used only to display the saved column in a readable form.
 *
 * 1  → A
 * 2  → B
 * 26 → Z
 * 27 → AA
 *
 ************************************************************/

function columnNumberToLetter(
  columnNumber
) {

  let number =
    Number(
      columnNumber
    );


  if (
    !Number.isInteger(
      number
    ) ||
    number < 1
  ) {

    return '?';

  }


  let result =
    '';


  while (
    number > 0
  ) {

    const remainder =
      (number - 1) % 26;


    result =
      String.fromCharCode(
        65 + remainder
      ) +
      result;


    number =
      Math.floor(
        (number - 1) / 26
      );

  }


  return result;

}


/************************************************************
 * ==========================================================
 * BUTTON HELPERS
 * ==========================================================
 */

function setButtonLoading(
  button,
  text
) {

  button.disabled =
    true;

  button.dataset.originalText =
    button.textContent;

  button.textContent =
    text;

  button.classList.add(
    'loading'
  );

}


function resetButton(
  button,
  text
) {

  button.disabled =
    false;

  button.textContent =
    text;

  button.classList.remove(
    'loading'
  );

}


/************************************************************
 * ==========================================================
 * HTML ESCAPE
 * ==========================================================
 */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

</script>
