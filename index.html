<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Inventory Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
/* =========================================================
   BASE
   ========================================================= */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #08090b;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding-top: env(safe-area-inset-top);
  /* room for the fixed SCAN bar */
  padding-bottom: calc(118px + env(safe-area-inset-bottom));
}

.app {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

/* =========================================================
   TOP BAR — back + destination
   ========================================================= */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  background: #111317;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.back-button {
  border: none;
  background: transparent;
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  padding: 10px 4px;
  cursor: pointer;
  white-space: nowrap;
}

.destination {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.timestamp-icon { color: #34d399; font-size: 14px; }

/* =========================================================
   CAMERA — big, tap to scan
   ========================================================= */

.camera-card {
  position: relative;
  margin: 10px 10px 0;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  border: 3px solid #23262c;
  min-height: 200px;
  transition: border-color .15s ease;
}

.camera-card.state-scanning { border-color: #facc15; }
.camera-card.state-ready    { border-color: #10b981; }

#reader {
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: #000 !important;
}

#reader video {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  max-height: 46vh !important;
  object-fit: cover !important;
  background: #000 !important;
}

/* Hide html5-qrcode's own shaded box — we draw our own frame */
#reader #qr-shaded-region { border-width: 0 !important; background: transparent !important; }

.scan-overlay {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 86%;
  max-width: 580px;
  aspect-ratio: 400 / 150;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 20;
}

.scan-frame {
  position: absolute;
  inset: 0;
  border: 4px solid rgba(255,255,255,.85);
  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.22);
  transition: border-color .12s ease, box-shadow .12s ease;
}

.scan-overlay.detected .scan-frame {
  border-color: #00ff9d;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.08), 0 0 32px rgba(0,255,157,.9);
  animation: detectedPulse .35s ease;
}

.scan-overlay.paused .scan-frame {
  border-color: rgba(255,255,255,.25);
  border-style: dashed;
}

@keyframes detectedPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.025); }
  100% { transform: scale(1); }
}

/* Message shown over the camera while paused / off */
.camera-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 30;
  text-align: center;
  pointer-events: none;
}

.camera-hint span {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(0,0,0,.72);
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .3px;
}

.camera-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: #6b7079;
  font-size: 15px;
  font-weight: 800;
}

/* =========================================================
   STATUS LINE
   ========================================================= */

.status {
  margin: 10px 10px 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: #15171b;
  text-align: center;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: .3px;
  color: #c9ccd1;
}

.status.scanning { color: #facc15; }
.status.ok       { color: #34d399; }
.status.error    { color: #ff7070; background: #2a1215; }

/* =========================================================
   LAST SCAN
   ========================================================= */

.last-scan {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 10px 10px 0;
  padding: 14px 16px;
  border-radius: 16px;
  background: #14161a;
  border: 2px solid #23262c;
}

.last-scan.saving { border-color: #a17d0a; }
.last-scan.saved  { border-color: #10b981; }
.last-scan.failed { border-color: #ef4444; }

.last-scan-label {
  color: #858991;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#itemCode {
  margin-top: 4px;
  font-size: 40px;
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 2px;
  word-break: break-all;
}

/* =========================================================
   SAVE STATE CHIPS
   ========================================================= */

.chip {
  flex-shrink: 0;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
  white-space: nowrap;
  background: #25282d;
  color: #969aa2;
}

.chip.saving { background: #3a2e05; color: #facc15; }
.chip.saved  { background: #063d2c; color: #34d399; }
.chip.failed { background: #4a1212; color: #ff7070; }

/* =========================================================
   RECENT SCANS
   ========================================================= */

.recent {
  margin: 12px 10px 0;
  border-radius: 16px;
  background: #101216;
  overflow: hidden;
}

.recent-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px 8px;
  color: #aeb2b8;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.recent-header button {
  border: none;
  background: transparent;
  color: #6b7079;
  font-size: 12px;
  font-weight: 800;
  padding: 6px 4px;
  cursor: pointer;
}

#recentList {
  list-style: none;
  margin: 0;
  padding: 0;
}

#recentList li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid rgba(255,255,255,.05);
}

.recent-code {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
}

.recent-time {
  margin-left: 8px;
  color: #6b7079;
  font-size: 12px;
  font-weight: 700;
}

.recent-empty {
  padding: 4px 14px 14px;
  color: #6b7079;
  font-size: 13px;
}

/* =========================================================
   CAMERA SETTINGS (collapsed)
   ========================================================= */

.settings {
  margin: 12px 10px 0;
  border-radius: 14px;
  background: #101216;
  color: #aeb2b8;
}

.settings summary {
  padding: 14px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.settings-body {
  padding: 0 14px 14px;
}

#cameraSelect {
  width: 100%;
  padding: 13px;
  border: 1px solid #363a40;
  border-radius: 10px;
  background: #0d0f12;
  color: #ffffff;
  font-size: 15px;
}

.settings-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #34373d;
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.small-button:disabled { opacity: .45; }

#cameraDiagnostics {
  margin-top: 10px;
  color: #777b83;
  font-size: 11px;
  line-height: 1.6;
}

#cameraDiagnostics strong { color: #aeb2b8; }

/* =========================================================
   BIG SCAN BUTTON — fixed at thumb reach
   ========================================================= */

.scan-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10000;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, #08090b 70%, rgba(8,9,11,0));
}

#scanButton {
  display: block;
  width: 100%;
  max-width: 696px;
  margin: 0 auto;
  min-height: 92px;
  border: none;
  border-radius: 20px;
  background: #10b981;
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(16,185,129,.30);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .06s ease, background .15s ease;
}

#scanButton:active { transform: scale(.98); }

#scanButton small {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .5px;
  opacity: .85;
}

#scanButton.scanning {
  background: #3a3d44;
  box-shadow: none;
  color: #facc15;
}

#scanButton.off {
  background: #2563eb;
  box-shadow: 0 6px 24px rgba(37,99,235,.30);
}

/* =========================================================
   LANDSCAPE / SMALL
   ========================================================= */

@media (max-width: 380px) {
  #itemCode { font-size: 34px; }
  #scanButton { min-height: 84px; font-size: 23px; }
}

@media (orientation: landscape) and (max-height: 600px) {
  #reader video { max-height: 60vh !important; }
  #scanButton { min-height: 70px; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <nav class="topbar">
    <button type="button" class="back-button" onclick="goBackToSetup()">← SETUP</button>
    <div id="scannerCurrentDestination" class="destination">Loading…</div>
  </nav>

  <!-- CAMERA (tap it to scan next) -->
  <section id="cameraCard" class="camera-card" onclick="onCameraTap()">

    <div id="reader"></div>

    <div id="cameraPlaceholder" class="camera-placeholder">
      Camera is off
    </div>

    <div id="scanOverlay" class="scan-overlay paused" hidden>
      <div class="scan-frame"></div>
    </div>

    <div id="cameraHint" class="camera-hint" hidden>
      <span id="cameraHintText">Tap to scan next</span>
    </div>

  </section>

  <!-- STATUS -->
  <div id="cameraStatus" class="status">PRESS START CAMERA</div>

  <!-- LAST SCAN -->
  <section id="lastScan" class="last-scan">
    <div>
      <div class="last-scan-label">Last item</div>
      <div id="itemCode">—</div>
    </div>
    <div id="lastScanChip" class="chip">—</div>
  </section>

  <!-- RECENT SCANS -->
  <section class="recent">
    <div class="recent-header">
      <span>Recent scans</span>
      <button type="button" onclick="clearRecentList()">Clear list</button>
    </div>
    <ul id="recentList"></ul>
    <div id="recentEmpty" class="recent-empty">Nothing scanned yet.</div>
  </section>

  <!-- CAMERA SETTINGS -->
  <details class="settings">
    <summary>⚙ Camera settings</summary>
    <div class="settings-body">

      <select id="cameraSelect">
        <option value="">Start camera to list cameras</option>
      </select>

      <div class="settings-row">
        <button type="button" id="stopButton" class="small-button" onclick="stopCamera()" disabled>
          Stop camera
        </button>
        <button type="button" id="soundButton" class="small-button" onclick="toggleSound()">
          Sound: ON
        </button>
      </div>

      <div id="cameraDiagnostics">Camera has not started yet.</div>

    </div>
  </details>

</div>

<!-- BIG SCAN BUTTON -->
<div class="scan-bar">
  <button type="button" id="scanButton" class="off" onclick="onScanButton()">
    START CAMERA
  </button>
</div>


<script>

/* ==========================================================
   SETTINGS
   ========================================================== */

/*
 * KA + 3, 4 or 5 digits.
 * (KA123, KA1234, KA12345)
 */
const ITEM_CODE_PATTERN = /^KA\d{3,5}$/;

/* Three identical reads required before an item counts. */
const REQUIRED_SCANS = 3;

const FPS = 15;

const QRBOX = { width: 400, height: 150 };

const FORMATS = [
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.QR_CODE
];

const CAMERA_STORAGE_KEY = "qrScannerSelectedCameraV1";
const RECENT_STORAGE_KEY = "qrScannerRecentV1";
const SOUND_STORAGE_KEY  = "qrScannerSoundV1";
const RECENT_MAX = 15;


/* ==========================================================
   GLOBALS
   ========================================================== */

let html5QrCode = null;
let scannerRunning = false;
let scannerPaused = false;

let availableCameras = [];
let selectedCameraId = safeGet(CAMERA_STORAGE_KEY) || "";

let lastReadValue = "";
let confirmationCount = 0;
let confirmedItemCode = "";
let resultLocked = false;

/* scanId of the item shown in "Last item" */
let lastScanId = "";

let recentScans = loadRecentScans();

let soundEnabled = safeGet(SOUND_STORAGE_KEY) !== "off";

let audioContext = null;


/* ==========================================================
   SMALL HELPERS
   ========================================================== */

function safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
}

function $(id) {
  return document.getElementById(id);
}


/* ==========================================================
   ONE BUTTON — START / SCAN NEXT
   ========================================================== */

/*
 * One scan per tap.
 *
 * - Camera off      → start camera and scan one item
 * - Waiting for tap → scan one item
 * - Already scanning → nothing (keep holding steady)
 *
 * After an item is verified, decoding pauses, so no
 * random barcode can be picked up between taps.
 */
function onScanButton() {

  unlockAudio();

  if (!scannerRunning) {
    startCamera();
    return;
  }

  if (scannerPaused) {
    scanAnother();
  }

}

/* Tapping the camera picture does the same as SCAN NEXT. */
function onCameraTap() {

  if (scannerRunning && scannerPaused) {
    unlockAudio();
    scanAnother();
  }

}


/* ==========================================================
   UI STATE
   ========================================================== */

function setUiState(state) {

  const button = $("scanButton");
  const card = $("cameraCard");
  const hint = $("cameraHint");
  const hintText = $("cameraHintText");
  const overlay = $("scanOverlay");

  button.classList.remove("off", "scanning");
  card.classList.remove("state-scanning", "state-ready");

  if (state === "off") {

    button.classList.add("off");
    button.innerHTML = "START CAMERA";
    hint.hidden = true;
    overlay.hidden = true;
    $("cameraPlaceholder").hidden = false;

  }

  else if (state === "starting") {

    button.classList.add("scanning");
    button.innerHTML = "STARTING CAMERA…";
    hint.hidden = true;

  }

  else if (state === "scanning") {

    button.classList.add("scanning");
    button.innerHTML = "SCANNING…<small>hold the barcode inside the frame</small>";
    card.classList.add("state-scanning");
    hint.hidden = true;
    overlay.hidden = false;
    $("cameraPlaceholder").hidden = true;
    setScanVisual("scanning");

  }

  else if (state === "ready") {

    button.innerHTML = "SCAN NEXT<small>or tap the camera</small>";
    card.classList.add("state-ready");
    hintText.textContent = "Tap to scan next";
    hint.hidden = false;
    overlay.hidden = false;

  }

}


/* ==========================================================
   START CAMERA
   ========================================================== */

async function startCamera() {

  if (scannerRunning) {
    return;
  }

  try {

    setUiState("starting");
    setCameraStatus("REQUESTING CAMERA…", "");

    availableCameras = await Html5Qrcode.getCameras();

    if (!availableCameras || availableCameras.length === 0) {
      throw new Error("No camera was found.");
    }

    populateCameraSelector(availableCameras);

    /* Use the remembered camera only if it still exists. */
    const remembered = availableCameras.some(function(camera) {
      return camera.id === selectedCameraId;
    });

    if (!remembered) {
      selectedCameraId = chooseInitialCamera(availableCameras);
    }

    $("cameraSelect").value = selectedCameraId;

    await startSelectedCamera(selectedCameraId);

  }

  catch (error) {

    console.error("START CAMERA ERROR:", error);

    scannerRunning = false;
    html5QrCode = null;

    setCameraStatus("CAMERA ERROR — " + readableCameraError(error), "error");
    setUiState("off");

  }

}


/* ==========================================================
   CAMERA SELECTOR
   ========================================================== */

function populateCameraSelector(cameras) {

  const select = $("cameraSelect");

  select.innerHTML = "";

  cameras.forEach(function(camera, index) {

    const option = document.createElement("option");

    option.value = camera.id;
    option.textContent = camera.label || ("Camera " + (index + 1));

    select.appendChild(option);

  });

  select.onchange = async function() {

    const newCameraId = this.value;

    if (!newCameraId) {
      return;
    }

    selectedCameraId = newCameraId;
    safeSet(CAMERA_STORAGE_KEY, newCameraId);

    if (scannerRunning) {

      try {
        await switchCamera(newCameraId);
      }

      catch (error) {
        console.error("CAMERA SWITCH ERROR:", error);
      }

    }

  };

}


function chooseInitialCamera(cameras) {

  const rearKeywords = ["back", "rear", "environment", "camera2"];

  for (const camera of cameras) {

    const label = String(camera.label || "").toLowerCase();

    for (const keyword of rearKeywords) {

      if (label.includes(keyword)) {
        return camera.id;
      }

    }

  }

  /* On many Android phones the rear camera is listed last. */
  return cameras.length > 1
    ? cameras[cameras.length - 1].id
    : cameras[0].id;

}


/* ==========================================================
   START A SPECIFIC CAMERA
   ========================================================== */

async function startSelectedCamera(cameraId) {

  if (!cameraId) {
    throw new Error("No camera selected.");
  }

  if (html5QrCode && scannerRunning) {

    try {
      await html5QrCode.stop();
    }

    catch (error) {
      console.log("Previous scanner stop:", error);
    }

  }

  html5QrCode = new Html5Qrcode("reader", {
    formatsToSupport: FORMATS,
    useBarCodeDetectorIfSupported: true,
    verbose: false
  });

  resetVerification();

  setCameraStatus("STARTING CAMERA…", "");

  await html5QrCode.start(
    cameraId,
    {
      fps: FPS,
      qrbox: QRBOX,
      disableFlip: false
    },
    onScanSuccess,
    function() {
      /* Ignore normal failed frames. */
    }
  );

  scannerRunning = true;
  scannerPaused = false;

  safeSet(CAMERA_STORAGE_KEY, cameraId);

  $("stopButton").disabled = false;

  setUiState("scanning");
  setCameraStatus("SCANNING — HOLD BARCODE IN FRAME", "scanning");

  inspectCamera();

  setTimeout(tryEnableContinuousFocus, 700);

}


async function switchCamera(cameraId) {

  if (!cameraId) {
    return;
  }

  setCameraStatus("SWITCHING CAMERA…", "");

  if (html5QrCode && scannerRunning) {

    try {
      await html5QrCode.stop();
    }

    catch (error) {
      console.log("Stop before switch:", error);
    }

  }

  scannerRunning = false;
  scannerPaused = false;

  await startSelectedCamera(cameraId);

}


/* ==========================================================
   SCAN SUCCESS (every decoded frame)
   ========================================================== */

function onScanSuccess(decodedText, decodedResult) {

  /* Ignore everything once an item is verified, until next tap. */
  if (resultLocked || scannerPaused) {
    return;
  }

  const value = String(decodedText || "").trim().toUpperCase();

  if (!value) {
    return;
  }

  /* Not KA + 3/4/5 digits → ignore, keep looking. */
  if (!ITEM_CODE_PATTERN.test(value)) {

    setCameraStatus("NOT AN ITEM CODE — " + value.substring(0, 20), "scanning");

    return;

  }

  if (value === lastReadValue) {
    confirmationCount++;
  }

  else {
    lastReadValue = value;
    confirmationCount = 1;
  }

  setCameraStatus(
    "READING " + value + " — " + confirmationCount + "/" + REQUIRED_SCANS,
    "scanning"
  );

  if (confirmationCount >= REQUIRED_SCANS) {
    confirmItem(value, decodedResult);
  }

}


/* ==========================================================
   CONFIRM ITEM — 3 matching reads
   ========================================================== */

function confirmItem(value, decodedResult) {

  resultLocked = true;
  confirmedItemCode = value;

  /* Stop decoding right away so nothing else is picked up. */
  if (html5QrCode && scannerRunning) {

    try {
      html5QrCode.pause(false);
      scannerPaused = true;
    }

    catch (error) {
      console.log("Pause unavailable:", error);
      scannerPaused = true;
    }

  }

  setScanVisual("detected");
  setUiState("ready");

  /* Short buzz = item captured (the save sound comes later). */
  if (navigator.vibrate) {
    navigator.vibrate(60);
  }

  handleInventoryItem(value, decodedResult);

}


/* ==========================================================
   SCAN NEXT
   ========================================================== */

function scanAnother() {

  resetVerification();

  if (html5QrCode && scannerRunning && scannerPaused) {

    try {

      html5QrCode.resume();
      scannerPaused = false;

      setUiState("scanning");
      setCameraStatus("SCANNING — HOLD BARCODE IN FRAME", "scanning");

    }

    catch (error) {

      console.error("RESUME ERROR:", error);
      setCameraStatus("CAMERA PAUSED — PRESS STOP, THEN START", "error");

    }

  }

}


function resetVerification() {

  lastReadValue = "";
  confirmationCount = 0;
  confirmedItemCode = "";
  resultLocked = false;

}


/* ==========================================================
   STOP CAMERA
   ========================================================== */

async function stopCamera() {

  if (!html5QrCode || !scannerRunning) {
    return;
  }

  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.error("STOP ERROR:", error);

  }

  scannerRunning = false;
  scannerPaused = false;
  html5QrCode = null;

  resetVerification();

  $("stopButton").disabled = true;

  setUiState("off");
  setCameraStatus("CAMERA STOPPED", "");

}


/* ==========================================================
   HAND OFF TO THE SAVE QUEUE
   ========================================================== */

function handleInventoryItem(itemCode, decodedResult) {

  try {

    const result = queueVerifiedScan(itemCode);

    if (result && result.success) {

      lastScanId = result.scanId;

      addRecentScan({
        scanId: result.scanId,
        itemCode: itemCode,
        time: Date.now(),
        status: "saving"
      });

      showLastScan(itemCode, "saving");

      setCameraStatus("✓ " + itemCode + " CAPTURED — SAVING…", "ok");

      return;

    }

    showNotQueuedError(itemCode, result && result.error);

  }

  catch (error) {

    console.error("SCANNER SYNC ERROR:", error);

    showNotQueuedError(itemCode, error && error.message);

  }

}


function showNotQueuedError(itemCode, reason) {

  lastScanId = "";

  showLastScan(itemCode, "failed");

  setCameraStatus(
    "✗ " + itemCode + " NOT SAVED — " + (reason || "scan it again"),
    "error"
  );

  playErrorSound();

  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }

}


/* ==========================================================
   SAVE CONFIRMATIONS FROM scanner-sync.js
   ========================================================== */

/*
 * The success sound plays ONLY here — after Google Apps
 * Script answered that the item was written.
 */
window.addEventListener("scansync:saved", function(event) {

  const detail = event.detail || {};

  updateRecentStatus(detail.scanId, "saved");

  if (detail.scanId === lastScanId) {
    showLastScan(detail.itemCode, "saved");
  }

  /* Don't overwrite the status while the next item is being read. */
  if (detail.scanId === lastScanId && scannerPaused) {
    setCameraStatus("✓ " + detail.itemCode + " SAVED — TAP SCAN NEXT", "ok");
  }

  playSuccessSound();

});


window.addEventListener("scansync:retry", function(event) {

  const detail = event.detail || {};

  updateRecentStatus(detail.scanId, "failed");

  if (detail.scanId === lastScanId) {
    showLastScan(detail.itemCode, "failed");
  }

  /* Warn once per scan, not on every retry. */
  if (Number(detail.retries) === 1) {

    setCameraStatus(
      "⚠ " + detail.itemCode + " NOT SAVED YET — RETRYING, KEEP SCANNING",
      "error"
    );

    playErrorSound();

  }

});


/* ==========================================================
   LAST SCAN + RECENT LIST
   ========================================================== */

const CHIP_TEXT = {
  saving: "SAVING…",
  saved: "✓ SAVED",
  failed: "✗ NOT SAVED"
};


function showLastScan(itemCode, status) {

  $("itemCode").textContent = itemCode;

  const box = $("lastScan");
  box.classList.remove("saving", "saved", "failed");
  box.classList.add(status);

  const chip = $("lastScanChip");
  chip.className = "chip " + status;
  chip.textContent = status === "failed" && lastScanId
    ? "RETRYING…"
    : CHIP_TEXT[status];

}


function loadRecentScans() {

  try {

    const parsed = JSON.parse(safeGet(RECENT_STORAGE_KEY) || "[]");

    return Array.isArray(parsed) ? parsed : [];

  }

  catch (error) {

    return [];

  }

}


function saveRecentScans() {

  safeSet(RECENT_STORAGE_KEY, JSON.stringify(recentScans));

}


function addRecentScan(entry) {

  recentScans.unshift(entry);
  recentScans = recentScans.slice(0, RECENT_MAX);

  saveRecentScans();
  renderRecentScans();

}


function updateRecentStatus(scanId, status) {

  const entry = recentScans.find(function(item) {
    return item.scanId === scanId;
  });

  if (!entry) {
    return;
  }

  entry.status = status;

  saveRecentScans();
  renderRecentScans();

}


/*
 * After a reload: a scan is only removed from the save queue
 * when Google confirmed it, so anything no longer in the queue
 * is saved. Anything still in the queue is still pending.
 */
function reconcileRecentScans() {

  if (typeof getScannerSyncQueue !== "function") {
    return;
  }

  const pending = {};

  getScannerSyncQueue().forEach(function(item) {
    if (item && item.scanId) {
      pending[item.scanId] = item;
    }
  });

  recentScans.forEach(function(entry) {

    if (pending[entry.scanId]) {

      entry.status = Number(pending[entry.scanId].retries || 0) > 0
        ? "failed"
        : "saving";

    }

    else if (entry.status !== "saved") {

      entry.status = "saved";

    }

  });

  saveRecentScans();

}


function renderRecentScans() {

  const list = $("recentList");

  list.innerHTML = "";

  $("recentEmpty").hidden = recentScans.length > 0;

  recentScans.forEach(function(entry) {

    const li = document.createElement("li");

    const time = new Date(entry.time).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });

    li.innerHTML =
      "<div>" +
        '<span class="recent-code">' + escapeHtml(entry.itemCode) + "</span>" +
        '<span class="recent-time">' + escapeHtml(time) + "</span>" +
      "</div>" +
      '<span class="chip ' + escapeHtml(entry.status) + '">' +
        escapeHtml(entry.status === "failed" ? "RETRYING…" : CHIP_TEXT[entry.status] || "") +
      "</span>";

    list.appendChild(li);

  });

}


function clearRecentList() {

  /* Only clears what is shown — never touches unsaved scans. */
  recentScans = recentScans.filter(function(entry) {
    return entry.status !== "saved";
  });

  saveRecentScans();
  renderRecentScans();

}


/* ==========================================================
   SOUND
   ========================================================== */

/*
 * Phones only allow sound after a tap, so the context is
 * created/resumed on the START / SCAN NEXT tap.
 */
function unlockAudio() {

  try {

    if (!audioContext) {

      const Context = window.AudioContext || window.webkitAudioContext;

      if (!Context) {
        return;
      }

      audioContext = new Context();

    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

  }

  catch (error) {

    console.log("Audio unavailable:", error);

  }

}


function playTone(frequency, startOffset, duration, type, volume) {

  const ctx = audioContext;
  const start = ctx.currentTime + startOffset;

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);

  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(start);
  oscillator.stop(start + duration + 0.02);

}


/* Bright rising "ding-ding" — Google confirmed the save. */
function playSuccessSound() {

  if (!soundEnabled || !audioContext) {
    return;
  }

  try {

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    playTone(1046.5, 0, 0.12, "sine", 0.5);
    playTone(1568, 0.11, 0.22, "sine", 0.5);

  }

  catch (error) {

    console.log("Sound error:", error);

  }

}


/* Low double buzz — not saved. */
function playErrorSound() {

  if (!soundEnabled || !audioContext) {
    return;
  }

  try {

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    playTone(220, 0, 0.18, "square", 0.25);
    playTone(180, 0.22, 0.28, "square", 0.25);

  }

  catch (error) {

    console.log("Sound error:", error);

  }

}


function toggleSound() {

  unlockAudio();

  soundEnabled = !soundEnabled;

  safeSet(SOUND_STORAGE_KEY, soundEnabled ? "on" : "off");

  $("soundButton").textContent = "Sound: " + (soundEnabled ? "ON" : "OFF");

  if (soundEnabled) {
    playSuccessSound();
  }

}


/* ==========================================================
   CONTINUOUS AUTOFOCUS
   ========================================================== */

function tryEnableContinuousFocus() {

  if (!html5QrCode || !scannerRunning) {
    return;
  }

  try {

    const capabilities = html5QrCode.getRunningTrackCapabilities();
    const focusModes = capabilities && capabilities.focusMode;

    if (!focusModes) {
      updateFocusDiagnostic("NOT EXPOSED");
      return;
    }

    if (!(Array.isArray(focusModes) && focusModes.includes("continuous"))) {
      updateFocusDiagnostic("NOT AVAILABLE");
      return;
    }

    html5QrCode
      .applyVideoConstraints({ advanced: [{ focusMode: "continuous" }] })
      .then(function() {
        updateFocusDiagnostic("ENABLED");
        setTimeout(inspectCamera, 250);
      })
      .catch(function(error) {
        console.log("FOCUS REQUEST REJECTED:", error);
        updateFocusDiagnostic("REJECTED");
      });

  }

  catch (error) {

    console.log("FOCUS CHECK ERROR:", error);
    updateFocusDiagnostic("UNAVAILABLE");

  }

}


/* ==========================================================
   CAMERA DIAGNOSTICS
   ========================================================== */

function inspectCamera() {

  if (!html5QrCode || !scannerRunning) {
    return;
  }

  try {

    const settings = html5QrCode.getRunningTrackSettings();

    const resolution = settings.width && settings.height
      ? settings.width + " × " + settings.height
      : "Unknown";

    const fps = settings.frameRate ? Math.round(settings.frameRate) : "Unknown";
    const zoom = settings.zoom !== undefined ? settings.zoom : "Native";
    const focus = settings.focusMode !== undefined ? settings.focusMode : "Browser managed";

    $("cameraDiagnostics").innerHTML =
      "<strong>Camera:</strong> " + escapeHtml(getSelectedCameraLabel()) + "<br>" +
      "<strong>Resolution:</strong> " + escapeHtml(resolution) + "<br>" +
      "<strong>FPS:</strong> " + escapeHtml(fps) + "<br>" +
      "<strong>Zoom:</strong> " + escapeHtml(zoom) + "<br>" +
      "<strong>Focus setting:</strong> " + escapeHtml(focus) + "<br>" +
      "<strong>Focus capability:</strong> checking…";

  }

  catch (error) {

    $("cameraDiagnostics").textContent = "Camera active. Detailed settings unavailable.";

  }

}


function getSelectedCameraLabel() {

  const camera = availableCameras.find(function(item) {
    return item.id === selectedCameraId;
  });

  return camera && camera.label ? camera.label : "Selected camera";

}


function updateFocusDiagnostic(message) {

  const element = $("cameraDiagnostics");

  if (!element) {
    return;
  }

  const text = escapeHtml(message);

  if (element.innerHTML.includes("Focus capability:")) {

    element.innerHTML = element.innerHTML.replace(
      /<strong>Focus capability:<\/strong>.*$/i,
      "<strong>Focus capability:</strong> " + text
    );

  }

  else {

    element.innerHTML += "<br><strong>Focus capability:</strong> " + text;

  }

}


/* ==========================================================
   VISUALS + STATUS
   ========================================================== */

function setScanVisual(state) {

  const overlay = $("scanOverlay");

  if (!overlay) {
    return;
  }

  overlay.classList.remove("scanning", "detected", "paused");
  overlay.classList.add(state);

}


function setCameraStatus(message, type) {

  const element = $("cameraStatus");

  if (!element) {
    return;
  }

  element.textContent = message;
  element.className = "status";

  if (type) {
    element.classList.add(type);
  }

}


function readableCameraError(error) {

  const text = String(error || "");

  if (text.includes("NotAllowedError")) return "ALLOW CAMERA PERMISSION";
  if (text.includes("NotFoundError")) return "NO CAMERA FOUND";
  if (text.includes("NotReadableError")) return "CAMERA IS BUSY";
  if (text.includes("OverconstrainedError")) return "CAMERA NOT COMPATIBLE";

  return text.substring(0, 150);

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function columnNumberToLetter(columnNumber) {

  let number = Number(columnNumber);

  if (!Number.isInteger(number) || number < 1) {
    return "?";
  }

  let result = "";

  while (number > 0) {

    const remainder = (number - 1) % 26;

    result = String.fromCharCode(65 + remainder) + result;

    number = Math.floor((number - 1) / 26);

  }

  return result;

}


/* ==========================================================
   DESTINATION (top right)
   ========================================================== */

function loadScannerNavigationDestination() {

  const element = $("scannerCurrentDestination");

  if (!element) {
    return;
  }

  try {

    const destination = getScannerSyncDestination();

    if (!destination) {

      element.textContent = "NO DESTINATION";
      element.style.color = "#ff7070";

      return;

    }

    element.style.color = "#ffffff";

    let html =
      escapeHtml(destination.sheetName) +
      " - " +
      escapeHtml(columnNumberToLetter(destination.itemCodeColumn));

    if (destination.timestampEnabled) {
      html += ' <span class="timestamp-icon" title="Timestamp enabled">🕒</span>';
    }

    element.innerHTML = html;

  }

  catch (error) {

    console.error("SCANNER NAVIGATION ERROR:", error);

    element.textContent = "DESTINATION ERROR";
    element.style.color = "#ff7070";

  }

}


/* ==========================================================
   BACK TO SETUP
   ========================================================== */

function goBackToSetup() {

  const pending = typeof getScannerSyncPendingCount === "function"
    ? getScannerSyncPendingCount()
    : 0;

  if (
    pending > 0 &&
    !confirm(
      pending +
      " scan(s) are not saved yet. They will keep trying " +
      "when you come back to the scanner. Leave anyway?"
    )
  ) {
    return;
  }

  /* Already confirmed — skip the browser's second prompt. */
  window.scannerSyncLeaveConfirmed = true;

  window.location.href = "setup.html";

}

</script>

<script src="scanner-sync.js"></script>

<script>
  loadScannerNavigationDestination();
  reconcileRecentScans();
  renderRecentScans();
  $("soundButton").textContent = "Sound: " + (soundEnabled ? "ON" : "OFF");
  setUiState("off");
</script>
