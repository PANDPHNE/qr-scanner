<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Barcode Scanner</title>


  <!-- html5-qrcode -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f5f7;

    }


    .container {

      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.12);

    }


    h1 {

      text-align: center;

      color: #174d1c;

      margin-bottom: 5px;

    }


    .description {

      text-align: center;

      color: #666;

      margin-top: 5px;

    }


    #reader {

      width: 100%;

      margin-top: 20px;

    }


    .status {

      margin-top: 20px;

      padding: 14px;

      border-radius: 10px;

      background: #fff3cd;

      color: #664d03;

      text-align: center;

      font-weight: bold;

      min-height: 48px;

    }


    .status.success {

      background: #d1e7dd;

      color: #0f5132;

    }


    .status.error {

      background: #f8d7da;

      color: #842029;

    }


    .result {

      margin-top: 15px;

      padding: 18px;

      border-radius: 10px;

      background: #e8f5e9;

    }


    .result-title {

      font-size: 14px;

      color: #2e7d32;

      font-weight: bold;

    }


    #result {

      margin-top: 8px;

      font-size: 30px;

      font-weight: bold;

      color: #111;

      word-break: break-all;

      text-align: center;

      letter-spacing: 2px;

    }


    .confirmation {

      margin-top: 10px;

      text-align: center;

      color: #555;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #1976d2;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #aaa;

      cursor: not-allowed;

    }


    .reset {

      background: #555;

    }


    .camera-note {

      margin-top: 15px;

      padding: 12px;

      background: #f1f3f4;

      border-radius: 10px;

      color: #555;

      font-size: 13px;

      text-align: center;

    }

  </style>

</head>



<body>


<div class="container">


  <h1>
    📷 Barcode Scanner
  </h1>


  <p class="description">
    Inventory barcode accuracy test
  </p>


  <div id="reader"></div>


  <div
    class="status"
    id="status">

    Press START CAMERA.

  </div>


  <div class="result">


    <div class="result-title">
      CONFIRMED ITEM CODE
    </div>


    <div id="result">
      Waiting...
    </div>


    <div
      class="confirmation"
      id="confirmation">

      No barcode confirmed yet.

    </div>


  </div>


  <button
    id="startButton"
    onclick="startCamera()">

    START CAMERA

  </button>


  <button
    id="stopButton"
    onclick="stopCamera()"
    disabled>

    STOP CAMERA

  </button>


  <button
    id="resetButton"
    class="reset"
    onclick="resetScanner()">

    RESET / SCAN NEXT ITEM

  </button>


  <div class="camera-note">

    Hold the barcode horizontally inside the
    scanning area. Test different distances
    to find the fastest usable range.

  </div>


</div>



<script>


/************************************************************
 * GLOBAL VARIABLES
 ************************************************************/


let html5QrCode = null;

let scannerRunning = false;


/*
 * Barcode confirmation system.
 *
 * Keep this at THREE reads for this test.
 * We don't want to change confirmation speed
 * while we're testing scan-distance performance.
 */

let lastReadValue = "";

let confirmationCount = 0;

let confirmedCode = "";


/*
 * Prevent repeated confirmation of the same item.
 */

let itemConfirmed = false;



/************************************************************
 * START CAMERA
 ************************************************************/


function startCamera() {


  if (scannerRunning) {

    return;

  }


  /*
   * Don't allow another scan until
   * the previous confirmed item is reset.
   */

  if (itemConfirmed) {

    setStatus(
      "Item already confirmed. Press RESET / SCAN NEXT ITEM.",
      "success"
    );

    return;

  }


  setStatus(
    "Requesting camera permission...",
    ""
  );


  document.getElementById(
    "startButton"
  ).disabled = true;


  /*
   * Create scanner.
   */

  html5QrCode =
    new Html5Qrcode("reader");



  /**********************************************************
   * BARCODE CONFIGURATION
   **********************************************************/

  const config = {

    /*
     * KEEP 15 FPS.
     *
     * This is part of our known-fast baseline.
     */

    fps: 15,


    /*
     * DYNAMIC WIDE SCANNING AREA
     *
     * Instead of the old fixed:
     *
     * 350 × 140
     *
     * we calculate the scan area based on
     * the actual camera dimensions.
     *
     * This should work better across
     * different Samsung screen/camera sizes.
     */

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {


      /*
       * Use approximately 85% of the
       * available camera width.
       */

      let width =
        Math.floor(
          viewfinderWidth * 0.85
        );


      /*
       * Use approximately 25% of the
       * available camera height.
       */

      let height =
        Math.floor(
          viewfinderHeight * 0.25
        );


      /*
       * Safety limits.
       *
       * Prevent the scan area from becoming
       * too small on smaller screens.
       */

      width =
        Math.max(
          width,
          280
        );


      height =
        Math.max(
          height,
          100
        );


      /*
       * Prevent the box from becoming
       * unnecessarily tall.
       */

      height =
        Math.min(
          height,
          180
        );


      /*
       * Prevent width from becoming larger
       * than the camera viewfinder.
       */

      width =
        Math.min(
          width,
          viewfinderWidth
        );


      /*
       * Return the final scanning region.
       */

      return {

        width:
          width,

        height:
          height

      };

    },


    /*
     * IMPORTANT:
     *
     * YOUR ACTUAL LABEL USES CODE 128.
     *
     * We are intentionally removing all
     * unnecessary formats for this test.
     *
     * This means the decoder doesn't need
     * to spend time checking:
     *
     * QR
     * EAN
     * UPC
     * CODE 39
     * CODE 93
     * etc.
     */

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128

    ]

  };



  /**********************************************************
   * START REAR CAMERA
   **********************************************************/

  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,


    /********************************************************
     * SUCCESSFUL CAMERA READ
     ********************************************************/

    function(
      decodedText,
      decodedResult
    ) {


      /*
       * Stop if an item has already been confirmed.
       */

      if (itemConfirmed) {

        return;

      }


      /*
       * Clean the camera result.
       */

      let value =
        String(
          decodedText || ""
        )
        .trim()
        .toUpperCase();


      console.log(
        "CAMERA READ:",
        value
      );


      /*
       * Ignore empty results.
       */

      if (!value) {

        return;

      }



      /********************************************************
       * ITEM CODE VALIDATION
       ********************************************************/

      /*
       * CURRENT ITEM CODE FORMAT:
       *
       * KA7195
       * KA3986
       * KA6399
       * KA7898
       *
       * KA + exactly 4 digits.
       */

      const itemCodePattern =
        /^KA\d{4}$/;


      if (
        !itemCodePattern.test(value)
      ) {


        setStatus(
          "Reading barcode...",
          ""
        );


        document.getElementById(
          "confirmation"
        ).textContent =
          "Barcode detected, but it does not match the expected item-code format.";


        console.log(
          "Rejected camera result:",
          value
        );


        return;

      }



      /********************************************************
       * THREE-READ CONFIRMATION
       ********************************************************/


      if (
        value === lastReadValue
      ) {


        confirmationCount++;


      }

      else {


        /*
         * Different barcode detected.
         *
         * Restart confirmation.
         */

        lastReadValue =
          value;

        confirmationCount =
          1;

      }


      /*
       * Show currently detected value.
       */

      document.getElementById(
        "result"
      ).textContent =
        value;


      document.getElementById(
        "confirmation"
      ).textContent =

        "Verification " +

        confirmationCount +

        " / 3";


      setStatus(

        "Checking barcode: " +

        value +

        " (" +

        confirmationCount +

        "/3)",

        ""

      );



      /********************************************************
       * FINAL CONFIRMATION
       ********************************************************/


      if (
        confirmationCount >= 3
      ) {


        /*
         * Confirm item.
         */

        confirmedCode =
          value;


        itemConfirmed =
          true;


        document.getElementById(
          "result"
        ).textContent =
          confirmedCode;


        document.getElementById(
          "confirmation"
        ).textContent =
          "✓ Barcode verified successfully";


        setStatus(

          "✅ CONFIRMED: " +
          confirmedCode,

          "success"

        );


        /*
         * Keep the historical behavior
         * unchanged for this test:
         *
         * camera stops after confirmation.
         */

        stopCamera();

      }

    },


    /********************************************************
     * SCAN FAILURE
     ********************************************************/

    function(errorMessage) {

      /*
       * Normal frame-by-frame failures
       * are ignored.
       */

    }

  )


  .then(function() {


    scannerRunning =
      true;


    setStatus(

      "📷 CAMERA ACTIVE — TEST THE BARCODE AT DIFFERENT DISTANCES",

      ""

    );


    document.getElementById(
      "stopButton"
    ).disabled =
      false;


  })


  .catch(function(error) {


    console.error(
      "Camera start failed:",
      error
    );


    scannerRunning =
      false;


    setStatus(

      "❌ CAMERA ERROR: " +
      error,

      "error"

    );


    document.getElementById(
      "startButton"
    ).disabled =
      false;

  });

}



/************************************************************
 * STOP CAMERA
 ************************************************************/


function stopCamera() {


  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  html5QrCode
    .stop()


    .then(function() {


      scannerRunning =
        false;


      setStatus(
        "Camera stopped.",
        ""
      );


      document.getElementById(
        "startButton"
      ).disabled =
        false;


      document.getElementById(
        "stopButton"
      ).disabled =
        true;


    })


    .catch(function(error) {


      console.error(
        "Camera stop failed:",
        error
      );


    });

}



/************************************************************
 * RESET FOR NEXT ITEM
 ************************************************************/


function resetScanner() {


  /*
   * Reset confirmation data.
   */

  lastReadValue =
    "";

  confirmationCount =
    0;

  confirmedCode =
    "";

  itemConfirmed =
    false;


  /*
   * Reset screen.
   */

  document.getElementById(
    "result"
  ).textContent =
    "Waiting...";


  document.getElementById(
    "confirmation"
  ).textContent =
    "No barcode confirmed yet.";


  setStatus(
    "Ready to scan the next item.",
    ""
  );


  /*
   * If camera isn't running,
   * allow user to start it.
   */

  document.getElementById(
    "startButton"
  ).disabled =
    false;

}



/************************************************************
 * STATUS DISPLAY
 ************************************************************/


function setStatus(
  message,
  type
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status";


  if (type) {

    status.classList.add(
      type
    );

  }

}


</script>

</body>

</html>
