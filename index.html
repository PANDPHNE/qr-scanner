<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KA Barcode Scanner</title>

  <!-- html5-qrcode -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #174d1c;
      margin-top: 5px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.4;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 10px;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
      text-align: center;
      font-weight: bold;
      min-height: 48px;
    }

    .status.success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status.error {
      background: #f8d7da;
      color: #842029;
    }

    .result {
      margin-top: 15px;
      padding: 18px;
      border-radius: 10px;
      background: #e8f5e9;
    }

    .result-title {
      font-size: 14px;
      color: #2e7d32;
      font-weight: bold;
    }

    #result {
      margin-top: 8px;
      font-size: 25px;
      font-weight: bold;
      color: #111;
      word-break: break-all;
      text-align: center;
    }

    #confirmation {
      margin-top: 8px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    .stop-button {
      background: #555;
    }

    .reset-button {
      background: #2e7d32;
    }

    .rules {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    .camera-info {
      margin-top: 10px;
      padding: 10px;
      background: #eef3ff;
      border-radius: 8px;
      color: #174ea6;
      font-size: 12px;
      text-align: center;
      word-break: break-word;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>📷 KA Barcode Scanner</h1>


  <p class="description">

    Scan an item barcode.

    The scanner accepts

    <strong>KA + numbers</strong>.

  </p>


  <!-- CAMERA -->

  <div id="reader"></div>


  <!-- CAMERA INFORMATION -->

  <div
    id="cameraInfo"
    class="camera-info">

    Camera not started.

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    Press START CAMERA.

  </div>


  <!-- RESULT -->

  <div class="result">

    <div class="result-title">
      SCANNED ITEM CODE
    </div>


    <div id="result">
      Waiting...
    </div>


    <div id="confirmation">
      No barcode confirmed yet.
    </div>

  </div>


  <!-- START -->

  <button
    id="startButton"
    onclick="startCamera()">

    START CAMERA

  </button>


  <!-- STOP -->

  <button
    id="stopButton"
    class="stop-button"
    onclick="stopCamera()"
    disabled>

    STOP CAMERA

  </button>


  <!-- RESET -->

  <button
    id="resetButton"
    class="reset-button"
    onclick="resetScanner()">

    RESET / SCAN NEXT ITEM

  </button>


  <div class="rules">

    Valid examples:

    <strong>KA7195</strong>,

    <strong>KA71955</strong>,

    <strong>KA719555</strong>

    <br><br>

    The number of digits is not limited.

  </div>


</div>



<script>


/************************************************************
 * ==========================================================
 * SCANNER VARIABLES
 * ==========================================================
 */

let html5QrCode = null;

let scannerRunning = false;

let scannerBusy = false;

let confirmationCount = 0;

let lastReadValue = "";

let itemConfirmed = false;


/************************************************************
 * ==========================================================
 * ITEM CODE RULE
 * ==========================================================
 *
 * KA + ONE OR MORE DIGITS
 *
 ************************************************************/

const ITEM_CODE_PATTERN =
  /^KA\d+$/;


/************************************************************
 * ==========================================================
 * START CAMERA
 * ==========================================================
 */

async function startCamera() {

  /*
   * Prevent multiple camera starts.
   */

  if (
    scannerRunning ||
    scannerBusy
  ) {

    return;

  }


  /*
   * Don't scan another item until
   * current item has been reset.
   */

  if (
    itemConfirmed
  ) {

    setStatus(
      "Item already confirmed. Press RESET / SCAN NEXT ITEM.",
      "success"
    );

    return;

  }


  scannerBusy = true;


  document
    .getElementById("startButton")
    .disabled = true;


  setStatus(
    "Preparing rear camera...",
    ""
  );


  try {

    /*
     * ======================================================
     * CLEAN OLD SCANNER
     * ======================================================
     */

    if (
      html5QrCode
    ) {

      try {

        await html5QrCode.stop();

      }

      catch (error) {

        console.warn(
          "Previous camera stop:",
          error
        );

      }


      try {

        html5QrCode.clear();

      }

      catch (error) {

        console.warn(
          "Previous scanner clear:",
          error
        );

      }


      html5QrCode =
        null;

    }


    document
      .getElementById("reader")
      .innerHTML = "";


    /*
     * ======================================================
     * GET AVAILABLE CAMERAS
     * ======================================================
     */

    const devices =
      await Html5Qrcode.getCameras();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "No camera was found on this device."
      );

    }


    console.log(
      "AVAILABLE CAMERAS:",
      devices
    );


    /*
     * ======================================================
     * SELECT REAR / MAIN CAMERA
     * ======================================================
     *
     * We look at the camera labels.
     *
     * Priority:
     *
     * 1. Main camera
     * 2. Back camera
     * 3. Rear camera
     * 4. Environment camera
     * 5. Other rear-looking camera
     *
     */

    let selectedCamera =
      null;


    const priorityWords = [

      "main",

      "back",

      "rear",

      "environment"

    ];


    /*
     * First try to find a camera whose label
     * contains one of the preferred words.
     */

    for (
      let p = 0;
      p < priorityWords.length;
      p++
    ) {

      const word =
        priorityWords[p];


      const match =
        devices.find(
          function(device) {

            const label =
              String(
                device.label || ""
              )
              .toLowerCase();


            return label.includes(
              word
            );

          }
        );


      if (
        match
      ) {

        selectedCamera =
          match;

        break;

      }

    }


    /*
     * If the browser doesn't expose useful
     * camera names, prefer the last camera.
     *
     * This is only a fallback.
     */

    if (
      !selectedCamera
    ) {

      selectedCamera =
        devices[
          devices.length - 1
        ];

    }


    console.log(
      "SELECTED CAMERA:",
      selectedCamera
    );


    document
      .getElementById("cameraInfo")
      .textContent =
      "Selected camera: " +
      (
        selectedCamera.label ||
        "Rear camera"
      );


    /*
     * ======================================================
     * CREATE FRESH SCANNER
     * ======================================================
     */

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    /*
     * ======================================================
     * SCANNER CONFIGURATION
     * ======================================================
     *
     * We deliberately keep FPS at 10.
     *
     * We are NOT using the previous aggressive
     * 350 x 140 configuration.
     *
     */

    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.ITF,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.QR_CODE

      ]

    };


    /*
     * ======================================================
     * START SELECTED CAMERA
     * ======================================================
     */

    await html5QrCode.start(

      selectedCamera.id,

      config,


      function(
        decodedText,
        decodedResult
      ) {

        handleScan(
          decodedText
        );

      },


      function(
        errorMessage
      ) {

        /*
         * Normal scanner failures
         * are ignored.
         */

      }

    );


    scannerRunning =
      true;


    scannerBusy =
      false;


    setStatus(
      "📷 MAIN / REAR CAMERA ACTIVE — ALIGN BARCODE INSIDE THE BOX",
      ""
    );


    document
      .getElementById("startButton")
      .disabled = true;


    document
      .getElementById("stopButton")
      .disabled = false;

  }


  catch (error) {

    console.error(
      "Camera start failed:",
      error
    );


    scannerRunning =
      false;


    scannerBusy =
      false;


    html5QrCode =
      null;


    document
      .getElementById("reader")
      .innerHTML = "";


    document
      .getElementById("cameraInfo")
      .textContent =
      "Camera not started.";


    document
      .getElementById("startButton")
      .disabled = false;


    document
      .getElementById("stopButton")
      .disabled = true;


    setStatus(
      "❌ CAMERA ERROR: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/************************************************************
 * ==========================================================
 * HANDLE SCAN
 * ==========================================================
 */

function handleScan(
  decodedText
) {

  if (
    itemConfirmed
  ) {

    return;

  }


  const value =
    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!value) {

    return;

  }


  console.log(
    "BARCODE READ:",
    value
  );


  /*
   * ========================================================
   * VALIDATE KA + DIGITS
   * ========================================================
   */

  if (
    !ITEM_CODE_PATTERN.test(
      value
    )
  ) {

    document
      .getElementById("result")
      .textContent =
      value;


    document
      .getElementById("confirmation")
      .textContent =
      "Rejected barcode.";


    setStatus(
      "❌ REJECTED — Code must be KA followed by numbers.",
      "error"
    );


    lastReadValue =
      "";

    confirmationCount =
      0;


    return;

  }


  /*
   * ========================================================
   * THREE READ CONFIRMATION
   * ========================================================
   */

  if (
    value === lastReadValue
  ) {

    confirmationCount++;

  }

  else {

    lastReadValue =
      value;

    confirmationCount =
      1;

  }


  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =
    "Verification " +
    confirmationCount +
    " / 3";


  setStatus(
    "Checking " +
    value +
    " — " +
    confirmationCount +
    " / 3",
    ""
  );


  /*
   * ========================================================
   * CONFIRM
   * ========================================================
   */

  if (
    confirmationCount >= 3
  ) {

    confirmItem(
      value
    );

  }

}


/************************************************************
 * ==========================================================
 * CONFIRM ITEM
 * ==========================================================
 */

async function confirmItem(
  value
) {

  /*
   * Lock item immediately.
   */

  itemConfirmed =
    true;


  confirmationCount =
    0;


  lastReadValue =
    "";


  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =
    "✓ BARCODE VERIFIED";


  setStatus(
    "✅ " +
    value +
    " verified.",
    "success"
  );


  /*
   * Stop camera safely.
   */

  await stopCamera();

}


/************************************************************
 * ==========================================================
 * STOP CAMERA
 * ==========================================================
 */

async function stopCamera() {

  /*
   * If no scanner exists,
   * just clean the interface.
   */

  if (
    !html5QrCode
  ) {

    scannerRunning =
      false;

    scannerBusy =
      false;


    document
      .getElementById("reader")
      .innerHTML = "";


    document
      .getElementById("startButton")
      .disabled = false;


    document
      .getElementById("stopButton")
      .disabled = true;


    return;

  }


  const scanner =
    html5QrCode;


  scannerRunning =
    false;


  scannerBusy =
    true;


  document
    .getElementById("stopButton")
    .disabled = true;


  try {

    /*
     * Stop actual camera stream.
     */

    await scanner.stop();

  }

  catch (error) {

    console.warn(
      "Camera stop warning:",
      error
    );

  }


  try {

    /*
     * Clear video and scanner UI.
     */

    scanner.clear();

  }

  catch (error) {

    console.warn(
      "Scanner clear warning:",
      error
    );

  }


  /*
   * Remove scanner reference.
   */

  if (
    html5QrCode === scanner
  ) {

    html5QrCode =
      null;

  }


  /*
   * Empty camera container.
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  scannerRunning =
    false;


  scannerBusy =
    false;


  document
    .getElementById("startButton")
    .disabled = false;


  document
    .getElementById("stopButton")
    .disabled = true;


  document
    .getElementById("cameraInfo")
    .textContent =
    "Camera stopped.";


  if (
    itemConfirmed
  ) {

    setStatus(
      "Item confirmed. Press RESET / SCAN NEXT ITEM.",
      "success"
    );

  }

  else {

    setStatus(
      "Camera stopped. Press START CAMERA to scan again.",
      ""
    );

  }

}


/************************************************************
 * ==========================================================
 * RESET / SCAN NEXT ITEM
 * ==========================================================
 */

async function resetScanner() {

  /*
   * Completely stop current camera.
   */

  if (
    html5QrCode ||
    scannerRunning
  ) {

    await stopCamera();

  }


  /*
   * Reset barcode state.
   */

  itemConfirmed =
    false;


  confirmationCount =
    0;


  lastReadValue =
    "";


  /*
   * Clear result.
   */

  document
    .getElementById("result")
    .textContent =
    "Waiting...";


  document
    .getElementById("confirmation")
    .textContent =
    "No barcode confirmed yet.";


  /*
   * Clear camera area.
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  document
    .getElementById("cameraInfo")
    .textContent =
    "Camera ready for next scan.";


  /*
   * Restore buttons.
   */

  document
    .getElementById("startButton")
    .disabled = false;


  document
    .getElementById("stopButton")
    .disabled = true;


  setStatus(
    "Ready for next scan. Press START CAMERA.",
    ""
  );

}


/************************************************************
 * ==========================================================
 * STATUS
 * ==========================================================
 */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status";


  if (
    type
  ) {

    status.classList.add(
      type
    );

  }

}

</script>

</body>

</html>
