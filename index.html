<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KA Barcode Scanner</title>

  <!-- html5-qrcode -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #174d1c;
      margin-top: 5px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.4;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
      text-align: center;
      font-weight: bold;
      min-height: 48px;
    }

    .status.success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status.error {
      background: #f8d7da;
      color: #842029;
    }

    .result {
      margin-top: 15px;
      padding: 18px;
      border-radius: 10px;
      background: #e8f5e9;
    }

    .result-title {
      font-size: 14px;
      color: #2e7d32;
      font-weight: bold;
    }

    #result {
      margin-top: 8px;
      font-size: 25px;
      font-weight: bold;
      color: #111;
      word-break: break-all;
      text-align: center;
    }

    #confirmation {
      margin-top: 8px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    .stop-button {
      background: #555;
    }

    .reset-button {
      background: #2e7d32;
    }

    .rules {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>📷 KA Barcode Scanner</h1>


  <p class="description">

    Scan an item barcode.

    The scanner accepts

    <strong>KA + numbers</strong>.

  </p>


  <!-- CAMERA -->

  <div id="reader"></div>


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    Press START CAMERA.

  </div>


  <!-- RESULT -->

  <div class="result">

    <div class="result-title">
      SCANNED ITEM CODE
    </div>


    <div id="result">
      Waiting...
    </div>


    <div id="confirmation">
      No barcode confirmed yet.
    </div>

  </div>


  <!-- START -->

  <button
    id="startButton"
    onclick="startCamera()">

    START CAMERA

  </button>


  <!-- STOP -->

  <button
    id="stopButton"
    class="stop-button"
    onclick="stopCamera()"
    disabled>

    STOP CAMERA

  </button>


  <!-- RESET -->

  <button
    id="resetButton"
    class="reset-button"
    onclick="resetScanner()">

    RESET / SCAN NEXT ITEM

  </button>


  <div class="rules">

    Valid examples:

    <strong>KA7195</strong>,

    <strong>KA71955</strong>,

    <strong>KA719555</strong>

    <br><br>

    The number of digits is not limited.

  </div>


</div>



<script>


/************************************************************
 * ==========================================================
 * SCANNER VARIABLES
 * ==========================================================
 */

let html5QrCode = null;

let scannerRunning = false;

let scannerBusy = false;

let confirmationCount = 0;

let lastReadValue = "";

let itemConfirmed = false;


/************************************************************
 * ==========================================================
 * ITEM CODE RULE
 * ==========================================================
 *
 * KA + ONE OR MORE DIGITS
 *
 * KA7195       ✓
 * KA71955      ✓
 * KA719555     ✓
 *
 * KA            ✗
 * ABC7195      ✗
 * 7195         ✗
 *
 ************************************************************/

const ITEM_CODE_PATTERN =
  /^KA\d+$/;


/************************************************************
 * ==========================================================
 * START CAMERA
 * ==========================================================
 */

function startCamera() {

  /*
   * Do not allow two cameras to start at the same time.
   */

  if (
    scannerRunning ||
    scannerBusy
  ) {

    return;

  }


  /*
   * Do not start another scan until
   * the current item has been reset.
   */

  if (
    itemConfirmed
  ) {

    setStatus(
      "Item already confirmed. Press RESET / SCAN NEXT ITEM.",
      "success"
    );

    return;

  }


  scannerBusy = true;


  setStatus(
    "Requesting camera permission...",
    ""
  );


  document
    .getElementById("startButton")
    .disabled = true;


  /*
   * Make sure the old reader area is empty.
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  /*
   * Create a fresh scanner.
   */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  /*
   * IMPORTANT:
   *
   * We are intentionally keeping the
   * camera configuration simple.
   *
   * This is closer to the version that
   * was giving you clear scanning.
   */

  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.CODABAR,

      Html5QrcodeSupportedFormats.QR_CODE

    ]

  };


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,


    function(
      decodedText,
      decodedResult
    ) {

      handleScan(
        decodedText
      );

    },


    function(
      errorMessage
    ) {

      /*
       * Normal scan failures are ignored.
       */

    }

  )

  .then(
    function() {

      scannerRunning = true;

      scannerBusy = false;


      setStatus(
        "📷 CAMERA ACTIVE — POINT AT THE BARCODE",
        ""
      );


      document
        .getElementById("startButton")
        .disabled = true;


      document
        .getElementById("stopButton")
        .disabled = false;

    }
  )

  .catch(
    function(error) {

      console.error(
        "Camera start failed:",
        error
      );


      scannerRunning = false;

      scannerBusy = false;

      html5QrCode = null;


      document
        .getElementById("reader")
        .innerHTML = "";


      document
        .getElementById("startButton")
        .disabled = false;


      document
        .getElementById("stopButton")
        .disabled = true;


      setStatus(
        "❌ CAMERA ERROR: " +
        (
          error.message ||
          error
        ),
        "error"
      );

    }
  );

}


/************************************************************
 * ==========================================================
 * HANDLE SCAN
 * ==========================================================
 */

function handleScan(
  decodedText
) {

  /*
   * Ignore anything after confirmation.
   */

  if (
    itemConfirmed
  ) {

    return;

  }


  const value =
    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!value) {

    return;

  }


  console.log(
    "BARCODE READ:",
    value
  );


  /*
   * ========================================================
   * VALIDATE ITEM CODE
   * ========================================================
   */

  if (
    !ITEM_CODE_PATTERN.test(
      value
    )
  ) {

    document
      .getElementById("result")
      .textContent =
      value;


    document
      .getElementById("confirmation")
      .textContent =
      "Rejected barcode.";


    setStatus(
      "❌ REJECTED — Code must be KA followed by numbers.",
      "error"
    );


    /*
     * Do not allow an invalid read
     * to participate in confirmation.
     */

    lastReadValue = "";

    confirmationCount = 0;


    return;

  }


  /*
   * ========================================================
   * CONFIRM SAME CODE THREE TIMES
   * ========================================================
   */

  if (
    value === lastReadValue
  ) {

    confirmationCount++;

  }

  else {

    lastReadValue =
      value;

    confirmationCount =
      1;

  }


  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =
    "Verification " +
    confirmationCount +
    " / 3";


  setStatus(
    "Checking " +
    value +
    " — " +
    confirmationCount +
    " / 3",
    ""
  );


  /*
   * ========================================================
   * CONFIRMED
   * ========================================================
   */

  if (
    confirmationCount >= 3
  ) {

    confirmItem(
      value
    );

  }

}


/************************************************************
 * ==========================================================
 * CONFIRM ITEM
 * ==========================================================
 */

function confirmItem(
  value
) {

  /*
   * Immediately lock the item.
   */

  itemConfirmed = true;


  confirmationCount = 0;

  lastReadValue = "";


  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =
    "✓ BARCODE VERIFIED";


  setStatus(
    "✅ " +
    value +
    " verified.",
    "success"
  );


  /*
   * Stop camera safely.
   */

  stopCamera();

}


/************************************************************
 * ==========================================================
 * STOP CAMERA
 * ==========================================================
 */

function stopCamera() {

  /*
   * Nothing to stop.
   */

  if (
    !html5QrCode
  ) {

    scannerRunning = false;

    scannerBusy = false;


    document
      .getElementById("reader")
      .innerHTML = "";


    document
      .getElementById("startButton")
      .disabled = false;


    document
      .getElementById("stopButton")
      .disabled = true;


    return;

  }


  /*
   * Keep reference to the current scanner.
   */

  const scanner =
    html5QrCode;


  /*
   * Immediately mark scanner as inactive
   * so another start cannot happen during
   * the shutdown process.
   */

  scannerRunning = false;

  scannerBusy = true;


  document
    .getElementById("stopButton")
    .disabled = true;


  /*
   * Stop camera stream.
   */

  scanner.stop()

  .then(
    function() {

      /*
       * Clear the scanner UI.
       */

      try {

        scanner.clear();

      }

      catch (error) {

        console.warn(
          "Scanner clear warning:",
          error
        );

      }


      finishCameraStop();

    }
  )

  .catch(
    function(error) {

      console.warn(
        "Camera stop warning:",
        error
      );


      /*
       * Even if stop() reports an error,
       * attempt to clear the scanner.
       */

      try {

        scanner.clear();

      }

      catch (clearError) {

        console.warn(
          "Clear warning:",
          clearError
        );

      }


      finishCameraStop();

    }
  );

}


/************************************************************
 * ==========================================================
 * FINISH CAMERA STOP
 * ==========================================================
 */

function finishCameraStop() {

  /*
   * Remove old scanner reference.
   */

  html5QrCode = null;


  scannerRunning = false;

  scannerBusy = false;


  /*
   * Completely empty the camera container.
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  /*
   * Restore buttons.
   */

  document
    .getElementById("startButton")
    .disabled = false;


  document
    .getElementById("stopButton")
    .disabled = true;


  /*
   * If an item was confirmed, tell the user
   * what to do next.
   */

  if (
    itemConfirmed
  ) {

    setStatus(
      "Item confirmed. Press RESET / SCAN NEXT ITEM.",
      "success"
    );

  }

  else {

    setStatus(
      "Camera stopped. Press START CAMERA to scan again.",
      ""
    );

  }

}


/************************************************************
 * ==========================================================
 * RESET / SCAN NEXT ITEM
 * ==========================================================
 */

function resetScanner() {

  /*
   * If the camera is currently active,
   * stop it first.
   */

  if (
    scannerRunning ||
    html5QrCode
  ) {

    stopCamera();

  }


  /*
   * Reset item confirmation.
   */

  itemConfirmed = false;

  confirmationCount = 0;

  lastReadValue = "";


  /*
   * Clear result.
   */

  document
    .getElementById("result")
    .textContent =
    "Waiting...";


  document
    .getElementById("confirmation")
    .textContent =
    "No barcode confirmed yet.";


  /*
   * Make sure the camera container
   * is empty.
   */

  document
    .getElementById("reader")
    .innerHTML = "";


  /*
   * Make sure START is available.
   */

  document
    .getElementById("startButton")
    .disabled = false;


  document
    .getElementById("stopButton")
    .disabled = true;


  setStatus(
    "Ready for next scan. Press START CAMERA.",
    ""
  );

}


/************************************************************
 * ==========================================================
 * STATUS
 * ==========================================================
 */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status";


  if (
    type
  ) {

    status.classList.add(
      type
    );

  }

}

</script>

</body>

</html>
