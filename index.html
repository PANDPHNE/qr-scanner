<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Inventory Scanner</title>


  <!--
    Official html5-qrcode library.

    This is the same library used by ScanApp.
  -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #090a0c;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    body {

      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom)
        0;

    }


    /* =====================================================
       APP
       ===================================================== */

    .app {

      width: 100%;

      max-width: 700px;

      min-height: 100vh;

      margin: 0 auto;

      background: #090a0c;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      padding:
        18px
        18px
        12px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 800;

    }


    .header p {

      margin:
        5px
        0
        0;

      color: #8f939a;

      font-size: 13px;

    }


    /* =====================================================
       CAMERA CARD
       ===================================================== */

    .camera-card {

      position: relative;

      margin:
        0
        10px;

      overflow: hidden;

      border-radius: 18px;

      background: #000;

      border:
        1px solid
        rgba(255,255,255,.08);

    }


    /*
     * IMPORTANT:
     *
     * We DO NOT give #reader a fixed height.
     *
     * The official documentation recommends allowing
     * the library to determine the video height from
     * the camera aspect ratio.
     */

    #reader {

      width: 100%;

      margin: 0;

      padding: 0;

      background: #000;

    }


    /*
     * Do NOT force video height.
     *
     * Only make it responsive.
     */

    #reader video {

      display: block !important;

      width: 100% !important;

      max-width: 100% !important;

      height: auto !important;

      background: #000 !important;

    }


    /* =====================================================
       OUR VISUAL SCAN FRAME
       ===================================================== */

    .scan-overlay {

      position: absolute;

      left: 50%;

      top: 50%;

      width: 86%;

      max-width: 560px;

      aspect-ratio: 400 / 150;

      transform:
        translate(
          -50%,
          -50%
        );

      pointer-events: none;

      z-index: 20;

    }


    /*
     * Dark transparent area around the barcode zone.
     *
     * This gives the ScanApp-like visual guidance
     * without interfering with html5-qrcode's actual
     * decoder.
     */

    .scan-frame {

      position: absolute;

      inset: 0;

      border:
        4px solid
        rgba(16,185,129,.72);

      border-radius: 18px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);

      transition:
        border-color .15s ease,
        box-shadow .15s ease;

    }


    /*
     * Corner emphasis.
     */

    .scan-frame::before,
    .scan-frame::after {

      content: "";

      position: absolute;

      inset: -4px;

      border-radius: 18px;

      pointer-events: none;

    }


    /*
     * Normal scanning state.
     */

    .scan-overlay.scanning
    .scan-frame {

      border-color:
        rgba(255,255,255,.78);

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);

    }


    /*
     * SUCCESS STATE.
     *
     * This is the green flash you requested.
     */

    .scan-overlay.detected
    .scan-frame {

      border-color:
        #00ff9d;

      box-shadow:

        0 0 0 9999px
        rgba(0,0,0,.10),

        0 0 28px
        rgba(0,255,157,.85);

      animation:
        detectedPulse
        .35s
        ease;

    }


    @keyframes detectedPulse {

      0% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.025);

      }

      100% {

        transform:
          scale(1);

      }

    }


    /* =====================================================
       CAMERA STATUS
       ===================================================== */

    .camera-status {

      margin:
        10px
        10px
        0;

      padding:
        12px
        14px;

      border-radius:
        12px;

      background:
        #15171b;

      border:
        1px solid
        rgba(255,255,255,.07);

      text-align:
        center;

      font-size:
        13px;

      font-weight:
        700;

      color:
        #b8bbc1;

    }


    .camera-status.active {

      color:
        #34d399;

    }


    .camera-status.error {

      color:
        #ff7070;

    }


    /* =====================================================
       START / STOP CONTROLS
       ===================================================== */

    .controls {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        10px;

      margin:
        10px;

    }


    button {

      border:
        none;

      border-radius:
        13px;

      padding:
        15px
        12px;

      font-size:
        16px;

      font-weight:
        800;

      cursor:
        pointer;

      color:
        white;

    }


    #startButton {

      background:
        #10b981;

    }


    #stopButton {

      background:
        #34373d;

    }


    button:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result-card {

      margin:
        12px
        10px
        0;

      padding:
        18px;

      border-radius:
        18px;

      background:
        #14161a;

      border:
        1px solid
        rgba(255,255,255,.08);

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }


    .result-card.detected {

      border-color:
        #10b981;

      box-shadow:
        0 0 28px
        rgba(16,185,129,.13);

    }


    .result-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        14px;

    }


    .result-title {

      font-size:
        18px;

      font-weight:
        800;

    }


    #resultBadge {

      padding:
        6px
        10px;

      border-radius:
        20px;

      background:
        #26292f;

      color:
        #989ba2;

      font-size:
        11px;

      font-weight:
        800;

    }


    #resultBadge.detected {

      background:
        #063d2c;

      color:
        #34d399;

    }


    .item-code {

      padding:
        20px
        12px;

      border-radius:
        14px;

      background:
        #0d0f12;

      border:
        1px solid
        #282b31;

      text-align:
        center;

    }


    .item-code-label {

      color:
        #858991;

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        1px;

      text-transform:
        uppercase;

    }


    #itemCode {

      margin-top:
        8px;

      font-size:
        38px;

      line-height:
        1.1;

      font-weight:
        900;

      letter-spacing:
        2px;

      word-break:
        break-all;

    }


    .details {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        10px;

      margin-top:
        12px;

    }


    .detail {

      padding:
        12px;

      border-radius:
        10px;

      background:
        #1b1e23;

    }


    .detail-label {

      color:
        #858991;

      font-size:
        10px;

      font-weight:
        800;

      text-transform:
        uppercase;

    }


    .detail-value {

      margin-top:
        5px;

      color:
        white;

      font-size:
        14px;

      font-weight:
        800;

    }


    /* =====================================================
       SCAN AGAIN
       ===================================================== */

    #scanAgain {

      width:
        100%;

      margin-top:
        14px;

      background:
        #10b981;

      box-shadow:
        0
        5px
        20px
        rgba(16,185,129,.20);

    }


    #scanAgain:active {

      transform:
        scale(.99);

    }


    /* =====================================================
       CAMERA INFORMATION
       ===================================================== */

    .diagnostics {

      margin:
        12px
        10px
        20px;

      padding:
        12px;

      border-radius:
        12px;

      background:
        #101216;

      color:
        #777b83;

      font-size:
        11px;

      line-height:
        1.6;

    }


    .diagnostics strong {

      color:
        #aeb2b8;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (
      max-width: 600px
    ) {

      .header h1 {

        font-size:
          21px;

      }


      #itemCode {

        font-size:
          34px;

      }


      .scan-overlay {

        width:
          88%;

      }

    }


  </style>

</head>



<body>


<div class="app">


  <!-- ===================================================
       HEADER
       =================================================== -->

  <header class="header">

    <h1>
      📷 Inventory Scanner
    </h1>

    <p>
      Point the rear camera at the barcode
    </p>

  </header>


  <!-- ===================================================
       CAMERA
       =================================================== -->

  <section class="camera-card">


    <div id="reader"></div>


    <!--
      Visual-only scan guide.

      The actual decoder still uses the qrbox
      configured in JavaScript.
    -->

    <div
      id="scanOverlay"
      class="scan-overlay scanning">

      <div class="scan-frame"></div>

    </div>


  </section>


  <!-- ===================================================
       STATUS
       =================================================== -->

  <div
    id="cameraStatus"
    class="camera-status">

    CAMERA READY — PRESS START CAMERA

  </div>


  <!-- ===================================================
       CONTROLS
       =================================================== -->

  <div class="controls">


    <button
      id="startButton"
      onclick="startCamera()">

      START CAMERA

    </button>


    <button
      id="stopButton"
      onclick="stopCamera()"
      disabled>

      STOP CAMERA

    </button>


  </div>


  <!-- ===================================================
       RESULT
       =================================================== -->

  <section
    id="resultCard"
    class="result-card">


    <div class="result-header">


      <div class="result-title">

        Scan Result

      </div>


      <div
        id="resultBadge">

        READY

      </div>


    </div>


    <div class="item-code">


      <div class="item-code-label">

        Item Code

      </div>


      <div id="itemCode">

        —

      </div>


    </div>


    <div class="details">


      <div class="detail">


        <div class="detail-label">

          Barcode

        </div>


        <div
          id="barcodeFormat"
          class="detail-value">

          —

        </div>


      </div>


      <div class="detail">


        <div class="detail-label">

          Scanner

        </div>


        <div
          id="scannerState"
          class="detail-value">

          Waiting

        </div>


      </div>


    </div>


    <button
      id="scanAgain"
      onclick="scanAnother()">

      SCAN ANOTHER

    </button>


  </section>


  <!-- ===================================================
       DIAGNOSTICS
       =================================================== -->

  <div class="diagnostics">


    <strong>Camera diagnostics</strong>


    <div id="cameraDiagnostics">

      Camera has not started yet.

    </div>


  </div>


</div>



<script>


/* ==========================================================
   GLOBALS
   ========================================================== */


/*
 * The scanner engine is deliberately Html5Qrcode,
 * NOT Html5QrcodeScanner.
 *
 * This preserves the architecture of your fastest
 * historical c4a9466 version.
 */

let html5QrCode = null;


let scannerRunning = false;


let scannerPaused = false;


/*
 * Prevent multiple success callbacks from creating
 * duplicate results.
 */

let resultLocked = false;


/*
 * Last result.
 */

let currentItemCode = "";


/*
 * Used for the green detection flash.
 */

let greenTimer = null;



/* ==========================================================
   CONFIGURATION
   ========================================================== */


/*
 * IMPORTANT:
 *
 * We keep 15 FPS because this was part of the
 * proven fast historical configuration.
 */

const FPS = 15;


/*
 * 400 × 150 is an official documented rectangular
 * barcode-style qrbox configuration.
 *
 * It is slightly wider than the historical 350 × 140,
 * giving the barcode more usable room.
 *
 * If this proves slower than c4a9466, our next test
 * will simply revert to 350 × 140.
 */

const QRBOX = {

  width: 400,

  height: 150

};


/*
 * Your actual labels are CODE_128.
 *
 * We also keep QR_CODE because you asked for QR
 * scanning capability.
 *
 * Restricting formats is officially supported and
 * can reduce decoding work.
 */

const FORMATS = [

  Html5QrcodeSupportedFormats.CODE_128,

  Html5QrcodeSupportedFormats.QR_CODE

];



/* ==========================================================
   START CAMERA
   ========================================================== */


function startCamera() {


  /*
   * Prevent duplicate camera starts.
   */

  if (scannerRunning) {

    return;

  }


  /*
   * If a scanner object already exists from a
   * previous session, create a fresh one only after
   * the previous stream has been stopped.
   */

  html5QrCode =
    new Html5Qrcode(

      "reader",

      {

        formatsToSupport:
          FORMATS,

        /*
         * Keep the library's native BarcodeDetector
         * path enabled when the browser supports it.
         *
         * The library documents this as potentially
         * providing faster native scanning.
         */

        useBarCodeDetectorIfSupported:
          true,

        verbose:
          false

      }

    );


  setCameraStatus(

    "STARTING CAMERA…",

    ""

  );


  document
    .getElementById(
      "startButton"
    )
    .disabled =
    true;


  document
    .getElementById(
      "stopButton"
    )
    .disabled =
    true;


  /*
   * Reset visual state.
   */

  resultLocked =
    false;

  scannerPaused =
    false;


  setScanVisual(
    "scanning"
  );



  /* ========================================================
     START THE REAR CAMERA
     ======================================================== */


  html5QrCode.start(

    /*
     * IMPORTANT:
     *
     * This is the exact rear-camera approach used
     * by your historical working version.
     */

    {
      facingMode:
        "environment"
    },


    {

      /*
       * Proven fast frame rate.
       */

      fps:
        FPS,


      /*
       * Barcode-shaped scanning region.
       */

      qrbox:
        QRBOX,


      /*
       * Keep mirrored-code support unchanged from
       * the historical version.
       */

      disableFlip:
        false

    },


    /*
     * SUCCESS CALLBACK
     */

    onScanSuccess,


    /*
     * FAILURE CALLBACK
     *
     * Do absolutely nothing here.
     *
     * Failed frames are normal.
     */

    function(errorMessage) {

      /*
       * Intentionally ignored.
       */

    }

  )


  .then(

    async function() {


      scannerRunning =
        true;


      scannerPaused =
        false;


      setCameraStatus(

        "● CAMERA ACTIVE",

        "active"

      );


      document
        .getElementById(
          "stopButton"
        )
        .disabled =
        false;


      document
        .getElementById(
          "scannerState"
        )
        .textContent =
        "Scanning";


      /*
       * Inspect the actual Samsung camera.
       */

      inspectCamera();


      /*
       * Give the camera a moment to stabilize,
       * then try continuous autofocus only if
       * the browser reports that it supports it.
       */

      setTimeout(

        function() {

          tryEnableContinuousFocus();

        },

        700

      );

    }

  )


  .catch(

    function(error) {


      console.error(
        "CAMERA START ERROR:",
        error
      );


      scannerRunning =
        false;


      html5QrCode =
        null;


      setCameraStatus(

        "CAMERA ERROR — " +
        readableCameraError(error),

        "error"

      );


      document
        .getElementById(
          "startButton"
        )
        .disabled =
        false;


      document
        .getElementById(
          "stopButton"
        )
        .disabled =
        true;

    }

  );

}



/* ==========================================================
   SUCCESSFUL SCAN
   ========================================================== */


function onScanSuccess(

  decodedText,

  decodedResult

) {


  /*
   * Ignore duplicate callbacks while the result
   * screen is holding the successful scan.
   */

  if (resultLocked) {

    return;

  }


  let value =

    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!value) {

    return;

  }


  console.log(
    "BARCODE DETECTED:",
    value
  );


  console.log(
    "FULL RESULT:",
    decodedResult
  );


  /*
   * Lock immediately.
   *
   * This prevents the same physical barcode
   * from firing repeatedly.
   */

  resultLocked =
    true;


  currentItemCode =
    value;


  /* ========================================================
     GREEN DETECTION
     ======================================================== */

  setScanVisual(
    "detected"
  );


  /*
   * Keep the green state visible briefly.
   */

  if (greenTimer) {

    clearTimeout(
      greenTimer
    );

  }


  greenTimer =

    setTimeout(

      function() {

        /*
         * Keep the frame green while the
         * result is being displayed.

         * We intentionally do not immediately
         * switch it back to white.
         */

      },

      350

    );



  /* ========================================================
     DISPLAY RESULT
     ======================================================== */


  document
    .getElementById(
      "itemCode"
    )
    .textContent =
    value;


  /*
   * Determine the decoded format if available.
   *
   * Since the scanner is restricted to CODE_128 + QR,
   * this is sufficient for our UI.
   */

  let detectedFormat =
    getDetectedFormat(
      decodedResult
    );


  document
    .getElementById(
      "barcodeFormat"
    )
    .textContent =
    detectedFormat;


  document
    .getElementById(
      "resultBadge"
    )
    .textContent =
    "✓ DETECTED";


  document
    .getElementById(
      "resultBadge"
    )
    .classList
    .add(
      "detected"
    );


  document
    .getElementById(
      "resultCard"
    )
    .classList
    .add(
      "detected"
    );


  document
    .getElementById(
      "scannerState"
    )
    .textContent =
    "Detected";


  /*
   * Pause decoding but KEEP THE CAMERA VIDEO RUNNING.
   *
   * This is important.
   *
   * We don't want to destroy and restart the camera
   * every time an item is scanned.
   */

  if (
    html5QrCode &&
    scannerRunning
  ) {


    try {

      html5QrCode.pause(
        false
      );

      scannerPaused =
        true;

    }

    catch(error) {

      console.log(
        "Pause after scan unavailable:",
        error
      );

    }

  }


  /*
   * This is the future Google Apps Script
   * integration point.
   */

  handleInventoryItem(

    value,

    decodedResult

  );

}



/* ==========================================================
   SCAN ANOTHER
   ========================================================== */


function scanAnother() {


  /*
   * Clear previous result.
   */

  resultLocked =
    false;


  currentItemCode =
    "";


  document
    .getElementById(
      "itemCode"
    )
    .textContent =
    "—";


  document
    .getElementById(
      "barcodeFormat"
    )
    .textContent =
    "—";


  document
    .getElementById(
      "resultBadge"
    )
    .textContent =
    "READY";


  document
    .getElementById(
      "resultBadge"
    )
    .classList
    .remove(
      "detected"
    );


  document
    .getElementById(
      "resultCard"
    )
    .classList
    .remove(
      "detected"
    );


  document
    .getElementById(
      "scannerState"
    )
    .textContent =
    "Scanning";


  /*
   * Return visual frame to scanning mode.
   */

  setScanVisual(
    "scanning"
  );


  /*
   * Resume the existing camera/decoder.
   *
   * This is faster than stopping and starting
   * the camera again.
   */

  if (
    html5QrCode &&
    scannerRunning &&
    scannerPaused
  ) {


    try {

      html5QrCode.resume();

      scannerPaused =
        false;

      setCameraStatus(

        "● CAMERA ACTIVE",

        "active"

      );

    }

    catch(error) {

      console.error(
        "Resume failed:",
        error
      );

      setCameraStatus(

        "PRESS START CAMERA TO CONTINUE",

        ""

      );

    }

  }

}



/* ==========================================================
   STOP CAMERA
   ========================================================== */


function stopCamera() {


  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  /*
   * stop() safely closes the video stream.
   *
   * The official API recommends calling stop()
   * when camera scanning is finished.
   */

  html5QrCode
    .stop()

    .then(

      function() {


        scannerRunning =
          false;


        scannerPaused =
          false;


        html5QrCode =
          null;


        setCameraStatus(

          "CAMERA STOPPED",

          ""

        );


        document
          .getElementById(
            "startButton"
          )
          .disabled =
          false;


        document
          .getElementById(
            "stopButton"
          )
          .disabled =
          true;


        document
          .getElementById(
            "scannerState"
          )
          .textContent =
          "Stopped";


      }

    )

    .catch(

      function(error) {


        console.error(
          "STOP CAMERA ERROR:",
          error
        );

      }

    );

}



/* ==========================================================
   AUTOFOCUS
   ========================================================== */


function tryEnableContinuousFocus() {


  /*
   * Do not attempt anything if the scanner
   * is no longer running.
   */

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {


    /*
     * Ask html5-qrcode for the actual camera
     * capabilities.
     *
     * This method is officially exposed by
     * Html5Qrcode.
     */

    const capabilities =

      html5QrCode
        .getRunningTrackCapabilities();


    console.log(
      "CAMERA CAPABILITIES:",
      capabilities
    );


    /*
     * Check whether the browser exposes
     * focusMode.
     */

    const focusModes =
      capabilities &&
      capabilities.focusMode;


    if (
      !focusModes
    ) {


      updateFocusDiagnostic(

        "Continuous focus: NOT EXPOSED"

      );


      return;

    }


    /*
     * Browser/device may return an array such as:
     *
     * ["none", "manual", "continuous"]
     */

    let supportsContinuous =

      Array.isArray(
        focusModes
      )
      &&
      focusModes.includes(
        "continuous"
      );


    if (
      !supportsContinuous
    ) {


      updateFocusDiagnostic(

        "Continuous focus: NOT AVAILABLE"

      );


      console.log(
        "Supported focus modes:",
        focusModes
      );


      return;

    }


    /*
     * The device explicitly reports that
     * continuous focus is available.
     *
     * NOW, and only now, request it.
     */

    html5QrCode

      .applyVideoConstraints({

        advanced: [

          {

            focusMode:
              "continuous"

          }

        ]

      })


      .then(

        function() {


          console.log(
            "CONTINUOUS AUTOFOCUS REQUESTED"
          );


          updateFocusDiagnostic(

            "Continuous focus: ENABLED"

          );


          /*
           * Verify the resulting settings.
           */

          try {

            const settings =

              html5QrCode
                .getRunningTrackSettings();


            console.log(
              "CAMERA SETTINGS AFTER FOCUS:",
              settings
            );

          }

          catch(error) {

            console.log(
              "Could not read camera settings:",
              error
            );

          }

        }

      )


      .catch(

        function(error) {


          console.log(
            "Continuous focus request rejected:",
            error
          );


          updateFocusDiagnostic(

            "Continuous focus: AVAILABLE, BUT BROWSER REJECTED REQUEST"

          );

        }

      );


  }

  catch(error) {


    console.log(
      "Focus capability check unavailable:",
      error
    );


    updateFocusDiagnostic(

      "Continuous focus: UNAVAILABLE"

    );

  }

}



/* ==========================================================
   CAMERA DIAGNOSTICS
   ========================================================== */


function inspectCamera() {


  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {


    const settings =

      html5QrCode
        .getRunningTrackSettings();


    const capabilities =

      html5QrCode
        .getRunningTrackCapabilities();


    console.log(
      "RUNNING CAMERA SETTINGS:",
      settings
    );


    console.log(
      "RUNNING CAMERA CAPABILITIES:",
      capabilities
    );


    let resolution =
      "Unknown";


    if (
      settings.width &&
      settings.height
    ) {

      resolution =

        settings.width +
        " × " +
        settings.height;

    }


    let fps =
      "Unknown";


    if (
      settings.frameRate
    ) {

      fps =
        String(
          Math.round(
            settings.frameRate
          )
        );

    }


    let zoom =
      "Not reported";


    if (
      settings.zoom !==
      undefined
    ) {

      zoom =
        String(
          settings.zoom
        );

    }


    document
      .getElementById(
        "cameraDiagnostics"
      )
      .innerHTML =

        "<strong>Resolution:</strong> " +
        escapeHtml(resolution) +

        "<br>" +

        "<strong>FPS:</strong> " +
        escapeHtml(fps) +

        "<br>" +

        "<strong>Zoom:</strong> " +
        escapeHtml(zoom) +

        "<br>" +

        "<strong>Focus:</strong> checking…";


  }

  catch(error) {


    document
      .getElementById(
        "cameraDiagnostics"
      )
      .textContent =

      "Camera is running, but detailed capabilities are unavailable.";

  }

}



/* ==========================================================
   FOCUS DIAGNOSTIC
   ========================================================== */


function updateFocusDiagnostic(
  message
) {


  const element =

    document.getElementById(
      "cameraDiagnostics"
    );


  /*
   * Preserve the existing diagnostic text
   * and append focus information.
   */

  if (
    element &&
    !element.innerHTML.includes(
      "Focus:"
    )
  ) {

    element.innerHTML +=
      "<br><strong>" +
      escapeHtml(message) +
      "</strong>";

  }

  else if (
    element
  ) {

    element.innerHTML =

      element.innerHTML
        .replace(
          /<strong>Focus:<\/strong>.*$/i,
          "<strong>" +
          escapeHtml(message) +
          "</strong>"
        );

  }

}



/* ==========================================================
   FORMAT DETECTION
   ========================================================== */


function getDetectedFormat(
  decodedResult
) {


  try {


    if (
      decodedResult &&
      decodedResult.result &&
      decodedResult.result.format
    ) {


      const format =
        decodedResult.result.format;


      /*
       * html5-qrcode may expose a numeric enum.
       *
       * Code 128 enum value is 5 in the current
       * library enum.
       *
       * QR_CODE enum value is 0.
       */

      if (
        typeof format ===
        "number"
      ) {


        if (
          format === 5
        ) {

          return "CODE_128";

        }


        if (
          format === 0
        ) {

          return "QR_CODE";

        }

      }


      return String(
        format
      );

    }

  }

  catch(error) {

    console.log(
      "Format detection unavailable:",
      error
    );

  }


  /*
   * Most of our inventory labels are Code 128.
   */

  return "CODE_128";

}



/* ==========================================================
   GREEN / SCAN VISUAL
   ========================================================== */


function setScanVisual(
  state
) {


  const overlay =

    document.getElementById(
      "scanOverlay"
    );


  if (!overlay) {

    return;

  }


  overlay.classList.remove(
    "scanning",
    "detected"
  );


  overlay.classList.add(
    state
  );

}



/* ==========================================================
   CAMERA STATUS
   ========================================================== */


function setCameraStatus(
  message,
  type
) {


  const element =

    document.getElementById(
      "cameraStatus"
    );


  element.textContent =
    message;


  element.className =
    "camera-status";


  if (type) {

    element.classList.add(
      type
    );

  }

}



/* ==========================================================
   CAMERA ERROR MESSAGE
   ========================================================== */


function readableCameraError(
  error
) {


  const text =
    String(
      error || ""
    );


  if (
    text.includes(
      "NotAllowedError"
    )
  ) {

    return "ALLOW CAMERA PERMISSION";

  }


  if (
    text.includes(
      "NotFoundError"
    )
  ) {

    return "NO CAMERA FOUND";

  }


  if (
    text.includes(
      "NotReadableError"
    )
  ) {

    return "CAMERA IS BUSY — CLOSE OTHER CAMERA APPS";

  }


  if (
    text.includes(
      "OverconstrainedError"
    )
  ) {

    return "CAMERA CONSTRAINT NOT SUPPORTED";

  }


  return text.substring(
    0,
    120
  );

}

/* ==========================================================
   HTML ESCAPE
   ========================================================== */


function escapeHtml(
  value
) {


  return String(
    value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
