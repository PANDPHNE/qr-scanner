<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>KA Barcode Scanner</title>


  <!-- =====================================================
       ZXING BROWSER
       ===================================================== -->

  <script
    src="https://unpkg.com/@zxing/browser@0.2.1">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f5f7;

    }


    .container {

      max-width: 520px;

      margin: auto;

      background: #ffffff;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.12);

    }


    h1 {

      text-align: center;

      color: #174d1c;

      margin-top: 5px;

      margin-bottom: 8px;

    }


    .description {

      text-align: center;

      color: #666;

      line-height: 1.45;

    }


    /* =====================================================
       CAMERA
       ===================================================== */

    .camera-wrapper {

      position: relative;

      margin-top: 20px;

      width: 100%;

      background: #000000;

      border-radius: 12px;

      overflow: hidden;

    }


    #video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 260px;

      max-height: 70vh;

      object-fit: cover;

      background: #000000;

    }


    /* =====================================================
       VISUAL GUIDE

       IMPORTANT:
       This is ONLY a guide.
       ZXing still analyzes the full video frame.
       ===================================================== */

    .scan-guide {

      position: absolute;

      left: 5%;

      right: 5%;

      top: 50%;

      height: 125px;

      transform: translateY(-50%);

      border: 2px solid rgba(0, 160, 255, .9);

      border-radius: 10px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.08);

    }


    .scan-line {

      position: absolute;

      left: 2%;

      right: 2%;

      top: 50%;

      height: 2px;

      background: #00aaff;

      box-shadow:
        0 0 8px rgba(0,170,255,.9);

    }


    .scan-label {

      position: absolute;

      left: 50%;

      bottom: -35px;

      transform: translateX(-50%);

      white-space: nowrap;

      color: #ffffff;

      background: rgba(0,0,0,.75);

      padding: 5px 10px;

      border-radius: 6px;

      font-size: 11px;

      font-weight: bold;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

      margin-top: 20px;

      padding: 14px;

      border-radius: 10px;

      background: #fff3cd;

      color: #664d03;

      text-align: center;

      font-weight: bold;

      min-height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .status.success {

      background: #d1e7dd;

      color: #0f5132;

    }


    .status.error {

      background: #f8d7da;

      color: #842029;

    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {

      margin-top: 15px;

      padding: 18px;

      border-radius: 10px;

      background: #e8f5e9;

    }


    .result-title {

      font-size: 14px;

      color: #2e7d32;

      font-weight: bold;

      text-align: center;

    }


    #result {

      margin-top: 8px;

      font-size: 30px;

      font-weight: bold;

      color: #111111;

      text-align: center;

      letter-spacing: 1px;

      min-height: 38px;

    }


    #confirmation {

      margin-top: 8px;

      text-align: center;

      color: #555555;

      font-size: 14px;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    #startButton {

      background: #1976d2;

    }


    .stop-button {

      background: #555555;

    }


    .reset-button {

      background: #2e7d32;

    }


    button:disabled {

      background: #aaaaaa;

      cursor: not-allowed;

    }


    /* =====================================================
       CAMERA INFORMATION
       ===================================================== */

    .camera-info {

      margin-top: 10px;

      padding: 11px;

      background: #eef3ff;

      border-radius: 8px;

      color: #174ea6;

      font-size: 12px;

      text-align: center;

      line-height: 1.55;

      word-break: break-word;

    }


    .focus-good {

      color: #137333;

      font-weight: bold;

    }


    .focus-warning {

      color: #b06000;

      font-weight: bold;

    }


    /* =====================================================
       RULES
       ===================================================== */

    .rules {

      margin-top: 15px;

      padding: 12px;

      background: #f1f3f4;

      border-radius: 10px;

      font-size: 13px;

      color: #555555;

      text-align: center;

      line-height: 1.5;

    }


    @media (max-width: 600px) {

      body {

        padding: 10px;

      }


      .container {

        padding: 15px;

      }


      #video {

        min-height: 250px;

      }


      #result {

        font-size: 27px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 KA Barcode Scanner
  </h1>


  <p class="description">

    Scan the inventory barcode.

    <br>

    <strong>CODE 128</strong>

    <br>

    Continuous autofocus is enabled when supported.

  </p>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div class="camera-wrapper">

    <video
      id="video"
      playsinline
      muted
      autoplay>
    </video>


    <div class="scan-guide">

      <div class="scan-line"></div>

      <div class="scan-label">
        ALIGN BARCODE HERE
      </div>

    </div>

  </div>


  <!-- =====================================================
       CAMERA INFO
       ===================================================== -->

  <div
    id="cameraInfo"
    class="camera-info">

    Camera not started.

  </div>


  <!-- =====================================================
       STATUS
       ===================================================== -->

  <div
    id="status"
    class="status">

    Press START CAMERA.

  </div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div class="result">

    <div class="result-title">
      SCANNED ITEM CODE
    </div>


    <div id="result">
      Waiting...
    </div>


    <div id="confirmation">
      No barcode confirmed yet.
    </div>

  </div>


  <!-- =====================================================
       BUTTONS
       ===================================================== -->

  <button
    id="startButton"
    onclick="startCamera()">

    START CAMERA

  </button>


  <button
    id="stopButton"
    class="stop-button"
    onclick="stopCamera()"
    disabled>

    STOP CAMERA

  </button>


  <button
    id="resetButton"
    class="reset-button"
    onclick="resetScanner()">

    RESET / SCAN NEXT ITEM

  </button>


  <!-- =====================================================
       RULES
       ===================================================== -->

  <div class="rules">

    Valid item examples:

    <strong>KA7195</strong>

    <br>

    <strong>KA1846</strong>

    <br><br>

    Barcode:

    <strong>CODE 128</strong>

    <br>

    Item code:

    <strong>KA + numbers</strong>

  </div>


</div>



<script>


/************************************************************
 * ==========================================================
 * SCANNER VARIABLES
 * ==========================================================
 */

let codeReader = null;

let scannerControls = null;

let scannerRunning = false;

let scannerBusy = false;

let itemConfirmed = false;


/*
 * Confirmation system.
 */

let confirmationCount = 0;

let lastReadValue = "";

let lastAcceptedReadTime = 0;


/*
 * Prevent the same physical frame from
 * being counted multiple times.
 */

const READ_COOLDOWN = 150;


/************************************************************
 * ==========================================================
 * ITEM CODE VALIDATION
 * ==========================================================
 */

const ITEM_CODE_PATTERN =
  /^KA\d+$/;


/************************************************************
 * ==========================================================
 * CAMERA PREFERENCES
 * ==========================================================
 */

const CAMERA_SETTINGS = {

  /*
   * High resolution request.
   *
   * The device may choose a lower supported value.
   */

  width: 1920,

  height: 1080,


  /*
   * Desired camera frame rate.
   */

  frameRate: 30,


  /*
   * Moderate zoom.
   *
   * We will NOT force this.
   *
   * We first inspect the phone's capabilities.
   */

  preferredZoom: 1.5

};


/************************************************************
 * ==========================================================
 * ZXING SETTINGS
 * ==========================================================
 */

function createHints() {


  const hints =
    new Map();


  /*
   * Try harder to locate the barcode.
   */

  if (
    window.ZXing &&
    window.ZXing.DecodeHintType
  ) {

    hints.set(

      window.ZXing.DecodeHintType.TRY_HARDER,

      true

    );


    /*
     * Only Code 128.
     */

    if (
      window.ZXing.BarcodeFormat
    ) {

      hints.set(

        window.ZXing.DecodeHintType.POSSIBLE_FORMATS,

        [

          window.ZXing.BarcodeFormat.CODE_128

        ]

      );

    }

  }


  return hints;

}


/************************************************************
 * ==========================================================
 * START CAMERA
 * ==========================================================
 */

async function startCamera() {


  if (
    scannerRunning ||
    scannerBusy
  ) {

    return;

  }


  if (
    itemConfirmed
  ) {

    setStatus(

      "Item already confirmed. " +
      "Press RESET / SCAN NEXT ITEM.",

      "success"

    );

    return;

  }


  scannerBusy =
    true;


  document
    .getElementById("startButton")
    .disabled =
    true;


  setStatus(

    "Starting rear camera and autofocus...",

    ""

  );


  try {


    /********************************************************
     * CLEAN PREVIOUS CAMERA
     ********************************************************/

    await cleanupScanner();


    /********************************************************
     * CHECK ZXING
     ********************************************************/

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "ZXing Browser failed to load."
      );

    }


    /********************************************************
     * CREATE READER
     ********************************************************/

    const hints =
      createHints();


    /*
     * BrowserMultiFormatOneDReader is designed
     * specifically for linear / 1D barcodes.
     *
     * Our labels are Code 128.
     */

    codeReader =

      new ZXingBrowser.BrowserMultiFormatOneDReader(

        hints,

        {

          /*
           * Keep decoding attempts reasonably fast.
           */

          delayBetweenScanAttempts: 80,

          delayBetweenScanSuccess: 80

        }

      );


    /********************************************************
     * VIDEO ELEMENT
     ********************************************************/

    const video =
      document.getElementById(
        "video"
      );


    /********************************************************
     * CAMERA CONSTRAINTS
     ********************************************************/

    const constraints = {

      audio: false,

      video: {

        /*
         * Rear/environment camera.
         */

        facingMode: {

          ideal:
            "environment"

        },


        /*
         * High resolution.
         */

        width: {

          ideal:
            CAMERA_SETTINGS.width

        },


        height: {

          ideal:
            CAMERA_SETTINGS.height

        },


        /*
         * Camera frame rate.
         */

        frameRate: {

          ideal:
            CAMERA_SETTINGS.frameRate,

          max:
            CAMERA_SETTINGS.frameRate

        },


        /*
         * Ask for continuous focus
         * at the initial camera request.
         *
         * The second focus pass below is
         * still necessary because browsers
         * can ignore unsupported constraints.
         */

        focusMode:
          "continuous"

      }

    };


    /********************************************************
     * START ZXING
     ********************************************************/

    scannerControls =

      await codeReader.decodeFromConstraints(

        constraints,

        video,

        function(
          result,
          error,
          controls
        ) {


          /*
           * No barcode in this frame.
           */

          if (
            !result
          ) {

            return;

          }


          const text =
            result.getText();


          handleScan(
            text
          );

        }

      );


    scannerRunning =
      true;


    scannerBusy =
      false;


    /********************************************************
     * WAIT FOR CAMERA TO SETTLE
     ********************************************************/

    await waitForVideoReady(
      video
    );


    /*
     * IMPORTANT:
     *
     * Now we have the REAL camera track.
     *
     * This is where we explicitly force
     * continuous autofocus.
     */

    await optimizeCameraFocus(
      video
    );


    /*
     * Give autofocus a short moment to settle.
     */

    await sleep(
      350
    );


    /*
     * Run the focus application one more time.
     *
     * Some Android browsers expose their
     * capabilities only after the stream starts.
     */

    await optimizeCameraFocus(
      video
    );


    /********************************************************
     * CAMERA INFORMATION
     ********************************************************/

    showCameraInfo(
      video
    );


    /********************************************************
     * UI
     ********************************************************/

    setStatus(

      "📷 CAMERA ACTIVE — CONTINUOUS AUTOFOCUS ENABLED",

      ""

    );


    document
      .getElementById("stopButton")
      .disabled =
      false;


  }


  catch (error) {


    console.error(
      "Scanner start error:",
      error
    );


    scannerRunning =
      false;


    scannerBusy =
      false;


    await cleanupScanner();


    document
      .getElementById("startButton")
      .disabled =
      false;


    document
      .getElementById("stopButton")
      .disabled =
      true;


    setStatus(

      "❌ CAMERA ERROR: " +
      (
        error.message ||
        error
      ),

      "error"

    );

  }

}


/************************************************************
 * ==========================================================
 * WAIT FOR VIDEO
 * ==========================================================
 */

function waitForVideoReady(
  video
) {


  return new Promise(
    function(resolve) {


      if (
        video.readyState >= 2
      ) {

        resolve();

        return;

      }


      const timeout =
        setTimeout(
          resolve,
          3000
        );


      video.addEventListener(

        "loadedmetadata",

        function() {

          clearTimeout(
            timeout
          );

          resolve();

        },

        {
          once: true
        }

      );

    }

  );

}


/************************************************************
 * ==========================================================
 * OPTIMIZE CAMERA FOCUS
 * ==========================================================
 *
 * This is the most important new function.
 *
 * It works directly with the actual
 * MediaStreamTrack.
 *
 ************************************************************
 */

async function optimizeCameraFocus(
  video
) {


  try {


    if (
      !video ||
      !video.srcObject
    ) {

      return;

    }


    const tracks =
      video.srcObject
        .getVideoTracks();


    if (
      !tracks ||
      tracks.length === 0
    ) {

      return;

    }


    const track =
      tracks[0];


    const capabilities =
      typeof track.getCapabilities === "function"

        ? track.getCapabilities()

        : {};


    const currentSettings =
      typeof track.getSettings === "function"

        ? track.getSettings()

        : {};


    console.log(
      "CAMERA CAPABILITIES:",
      capabilities
    );


    console.log(
      "CAMERA SETTINGS:",
      currentSettings
    );


    /********************************************************
     * BUILD FOCUS CONSTRAINTS
     ********************************************************/

    const focusConstraints = {};


    /*
     * Continuous autofocus.
     *
     * This is the key change.
     */

    if (
      capabilities.focusMode &&
      Array.isArray(
        capabilities.focusMode
      )
    ) {

      console.log(
        "Supported focus modes:",
        capabilities.focusMode
      );


      if (
        capabilities.focusMode.includes(
          "continuous"
        )
      ) {

        focusConstraints.focusMode =
          "continuous";

      }

      else if (
        capabilities.focusMode.includes(
          "single-shot"
        )
      ) {

        /*
         * We prefer continuous.
         *
         * If unavailable, we don't
         * repeatedly force single-shot.
         */

        console.warn(
          "Continuous autofocus unavailable."
        );

      }

    }


    /********************************************************
     * APPLY CONTINUOUS AUTOFOCUS
     ********************************************************/

    if (
      focusConstraints.focusMode
    ) {

      try {

        await track.applyConstraints({

          advanced: [

            focusConstraints

          ]

        });


        console.log(
          "✓ CONTINUOUS AUTOFOCUS APPLIED"
        );

      }

      catch (focusError) {

        console.warn(
          "Advanced autofocus failed:",
          focusError
        );


        /*
         * Try the simpler constraint form.
         */

        try {

          await track.applyConstraints({

            focusMode:
              "continuous"

          });


          console.log(
            "✓ CONTINUOUS AUTOFOCUS APPLIED (fallback)"
          );

        }

        catch (fallbackError) {

          console.warn(
            "Fallback autofocus failed:",
            fallbackError
          );

        }

      }

    }


    /********************************************************
     * OPTIONAL ZOOM
     *
     * Only apply if the device actually supports it.
     *
     * We keep it moderate.
     ********************************************************/

    if (
      capabilities.zoom &&
      typeof capabilities.zoom.min === "number" &&
      typeof capabilities.zoom.max === "number"
    ) {


      const minZoom =
        capabilities.zoom.min;


      const maxZoom =
        capabilities.zoom.max;


      /*
       * We don't want extreme digital zoom.
       */

      const desiredZoom =
        Math.min(

          Math.max(

            CAMERA_SETTINGS.preferredZoom,

            minZoom

          ),

          Math.min(
            maxZoom,
            2.0
          )

        );


      /*
       * Only zoom if the camera supports
       * something greater than 1.
       */

      if (
        desiredZoom > 1
      ) {

        try {

          await track.applyConstraints({

            advanced: [

              {

                zoom:
                  desiredZoom

              }

            ]

          });


          console.log(
            "Camera zoom:",
            desiredZoom
          );

        }

        catch (zoomError) {

          console.warn(
            "Zoom unavailable:",
            zoomError
          );

        }

      }

    }


    /********************************************************
     * FINAL SETTINGS
     ********************************************************/

    const finalSettings =
      typeof track.getSettings === "function"

        ? track.getSettings()

        : {};


    console.log(
      "FINAL CAMERA SETTINGS:",
      finalSettings
    );


  }

  catch (error) {

    /*
     * Focus optimization must NEVER
     * kill the scanner.
     */

    console.warn(
      "Camera focus optimization unavailable:",
      error
    );

  }

}


/************************************************************
 * ==========================================================
 * HANDLE BARCODE
 * ==========================================================
 */

function handleScan(
  decodedText
) {


  if (
    itemConfirmed
  ) {

    return;

  }


  const value =

    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (
    !value
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * Ignore repeated callbacks that
   * happen too quickly.
   */

  if (

    value === lastReadValue &&

    (
      now -
      lastAcceptedReadTime
    ) < READ_COOLDOWN

  ) {

    return;

  }


  lastAcceptedReadTime =
    now;


  console.log(
    "CODE 128 DETECTED:",
    value
  );


  /**********************************************************
   * VALIDATE
   **********************************************************/

  if (
    !ITEM_CODE_PATTERN.test(
      value
    )
  ) {

    console.warn(
      "Rejected barcode:",
      value
    );

    return;

  }


  /**********************************************************
   * CONFIRMATION
   **********************************************************/

  if (
    value === lastReadValue
  ) {

    confirmationCount++;

  }

  else {

    lastReadValue =
      value;

    confirmationCount =
      1;

  }


  /**********************************************************
   * DISPLAY
   **********************************************************/

  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =

    "Verification " +
    confirmationCount +
    " / 3";


  setStatus(

    "Checking " +
    value +
    " — " +
    confirmationCount +
    " / 3",

    ""

  );


  /**********************************************************
   * CONFIRM
   **********************************************************/

  if (
    confirmationCount >= 3
  ) {

    confirmItem(
      value
    );

  }

}


/************************************************************
 * ==========================================================
 * CONFIRM ITEM
 * ==========================================================
 */

async function confirmItem(
  value
) {


  if (
    itemConfirmed
  ) {

    return;

  }


  itemConfirmed =
    true;


  confirmationCount =
    0;


  lastReadValue =
    "";


  document
    .getElementById("result")
    .textContent =
    value;


  document
    .getElementById("confirmation")
    .textContent =
    "✓ BARCODE VERIFIED";


  setStatus(

    "✅ " +
    value +
    " verified.",

    "success"

  );


  await stopCamera();

}


/************************************************************
 * ==========================================================
 * SHOW CAMERA INFORMATION
 * ==========================================================
 */

function showCameraInfo(
  video
) {


  try {


    if (
      !video ||
      !video.srcObject
    ) {

      return;

    }


    const tracks =
      video.srcObject
        .getVideoTracks();


    if (
      !tracks.length
    ) {

      return;

    }


    const track =
      tracks[0];


    const settings =
      track.getSettings();


    const capabilities =

      typeof track.getCapabilities === "function"

        ? track.getCapabilities()

        : {};


    const width =
      settings.width ||
      "?";


    const height =
      settings.height ||
      "?";


    const fps =
      settings.frameRate

        ? Math.round(
            settings.frameRate
          )

        : "?";


    const zoom =
      settings.zoom

        ? Number(
            settings.zoom
          ).toFixed(1) + "×"

        : "default";


    let focusText =
      "not reported";


    let focusClass =
      "focus-warning";


    if (
      capabilities.focusMode &&
      Array.isArray(
        capabilities.focusMode
      )
    ) {

      if (
        capabilities.focusMode.includes(
          "continuous"
        )
      ) {

        focusText =
          "CONTINUOUS AUTOFOCUS ✓";

        focusClass =
          "focus-good";

      }

      else {

        focusText =
          "continuous focus unavailable";

      }

    }


    document
      .getElementById("cameraInfo")
      .innerHTML =

      "<strong>" +

      escapeHtml(

        track.label ||
        "Rear camera"

      ) +

      "</strong>" +

      "<br>" +

      "Resolution: " +

      width +

      " × " +

      height +

      "<br>" +

      "FPS: " +

      fps +

      " | Zoom: " +

      zoom +

      "<br>" +

      "<span class='" +

      focusClass +

      "'>" +

      focusText +

      "</span>";

  }


  catch (error) {

    console.warn(
      "Camera information error:",
      error
    );


    document
      .getElementById("cameraInfo")
      .textContent =
      "Rear camera active.";

  }

}


/************************************************************
 * ==========================================================
 * STOP CAMERA
 * ==========================================================
 */

async function stopCamera() {


  scannerRunning =
    false;


  scannerBusy =
    true;


  document
    .getElementById("stopButton")
    .disabled =
    true;


  try {

    if (
      scannerControls
    ) {

      scannerControls.stop();

    }

  }

  catch (error) {

    console.warn(
      "Scanner controls stop:",
      error
    );

  }


  try {

    if (
      codeReader &&
      typeof codeReader.reset === "function"
    ) {

      codeReader.reset();

    }

  }

  catch (error) {

    console.warn(
      "Reader reset:",
      error
    );

  }


  /*
   * Explicitly stop video tracks.
   */

  const video =
    document.getElementById(
      "video"
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }


  scannerControls =
    null;


  codeReader =
    null;


  scannerBusy =
    false;


  document
    .getElementById("startButton")
    .disabled =
    false;


  document
    .getElementById("stopButton")
    .disabled =
    true;


  document
    .getElementById("cameraInfo")
    .textContent =
    "Camera stopped.";


  if (
    itemConfirmed
  ) {

    setStatus(

      "Item confirmed. " +
      "Press RESET / SCAN NEXT ITEM.",

      "success"

    );

  }

  else {

    setStatus(

      "Camera stopped. " +
      "Press START CAMERA to scan again.",

      ""

    );

  }

}


/************************************************************
 * ==========================================================
 * CLEANUP
 * ==========================================================
 */

async function cleanupScanner() {


  try {

    if (
      scannerControls
    ) {

      scannerControls.stop();

    }

  }

  catch (error) {

    console.warn(
      "Cleanup controls:",
      error
    );

  }


  try {

    if (
      codeReader &&
      typeof codeReader.reset === "function"
    ) {

      codeReader.reset();

    }

  }

  catch (error) {

    console.warn(
      "Cleanup reader:",
      error
    );

  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }


  scannerControls =
    null;


  codeReader =
    null;

}


/************************************************************
 * ==========================================================
 * RESET
 * ==========================================================
 */

async function resetScanner() {


  await stopCamera();


  itemConfirmed =
    false;


  confirmationCount =
    0;


  lastReadValue =
    "";


  lastAcceptedReadTime =
    0;


  document
    .getElementById("result")
    .textContent =
    "Waiting...";


  document
    .getElementById("confirmation")
    .textContent =
    "No barcode confirmed yet.";


  document
    .getElementById("cameraInfo")
    .textContent =
    "Camera ready for next scan.";


  document
    .getElementById("startButton")
    .disabled =
    false;


  document
    .getElementById("stopButton")
    .disabled =
    true;


  setStatus(

    "Ready for next scan. " +
    "Press START CAMERA.",

    ""

  );

}


/************************************************************
 * ==========================================================
 * STATUS
 * ==========================================================
 */

function setStatus(
  message,
  type
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status";


  if (
    type
  ) {

    status.classList.add(
      type
    );

  }

}


/************************************************************
 * ==========================================================
 * SLEEP
 * ==========================================================
 */

function sleep(
  milliseconds
) {

  return new Promise(

    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }

  );

}


/************************************************************
 * ==========================================================
 * HTML ESCAPE
 * ==========================================================
 */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
