<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>KA Barcode Scanner</title>


  <!-- =====================================================
       HTML5 QR CODE / BARCODE SCANNER
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f3f5f7;

    }


    body {

      padding:
        12px;

    }


    .container {

      width: 100%;

      max-width:
        520px;

      margin:
        0 auto;

      background:
        #ffffff;

      border-radius:
        16px;

      padding:
        16px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,.12);

    }


    /* =====================================================
       HEADER
       ===================================================== */

    h1 {

      margin:
        4px 0 6px;

      text-align:
        center;

      color:
        #174d1c;

      font-size:
        25px;

    }


    .description {

      margin:
        0 0 14px;

      text-align:
        center;

      color:
        #666666;

      font-size:
        14px;

      line-height:
        1.45;

    }


    /* =====================================================
       CAMERA
       ===================================================== */

    .camera-wrapper {

      position:
        relative;

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        12px;

      background:
        #000000;

    }


    #reader {

      width:
        100%;

      min-height:
        300px;

      background:
        #000000;

    }


    /*
     * Make the camera video use the available width.
     */

    #reader video {

      display:
        block !important;

      width:
        100% !important;

      height:
        auto !important;

      max-width:
        100% !important;

      background:
        #000000;

      object-fit:
        cover;

    }


    /*
     * Hide html5-qrcode's built-in dashboard.
     *
     * We use our own buttons below.
     */

    #reader__dashboard {

      display:
        none !important;

    }


    #reader__dashboard_section {

      display:
        none !important;

    }


    #reader__camera_selection {

      display:
        none !important;

    }


    #reader__dashboard_section_csr {

      display:
        none !important;

    }


    /* =====================================================
       VISUAL GUIDE ONLY
       
       IMPORTANT:
       
       This DOES NOT restrict scanning.
       
       There is NO qrbox in the scanner configuration.
       The whole camera frame can be decoded.
       ===================================================== */

    .scan-guide {

      position:
        absolute;

      left:
        5%;

      right:
        5%;

      top:
        50%;

      height:
        120px;

      transform:
        translateY(-50%);

      border:
        2px solid
        rgba(0,170,255,.9);

      border-radius:
        10px;

      pointer-events:
        none;

      z-index:
        20;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.08);

    }


    .scan-line {

      position:
        absolute;

      left:
        2%;

      right:
        2%;

      top:
        50%;

      height:
        2px;

      background:
        #00aaff;

      box-shadow:
        0 0 8px
        rgba(0,170,255,.9);

    }


    .scan-label {

      position:
        absolute;

      left:
        50%;

      bottom:
        -34px;

      transform:
        translateX(-50%);

      white-space:
        nowrap;

      padding:
        5px 10px;

      border-radius:
        6px;

      color:
        #ffffff;

      background:
        rgba(0,0,0,.72);

      font-size:
        11px;

      font-weight:
        bold;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

      margin-top:
        14px;

      min-height:
        48px;

      padding:
        12px;

      border-radius:
        10px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      font-size:
        14px;

      font-weight:
        bold;

      color:
        #664d03;

      background:
        #fff3cd;

    }


    .status.ready {

      color:
        #174ea6;

      background:
        #dbeafe;

    }


    .status.success {

      color:
        #0f5132;

      background:
        #d1e7dd;

    }


    .status.error {

      color:
        #842029;

      background:
        #f8d7da;

    }


    /* =====================================================
       CAMERA INFO
       ===================================================== */

    .camera-info {

      margin-top:
        8px;

      padding:
        9px;

      border-radius:
        8px;

      color:
        #174ea6;

      background:
        #eef3ff;

      text-align:
        center;

      font-size:
        11px;

      line-height:
        1.45;

    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {

      margin-top:
        12px;

      padding:
        16px;

      border-radius:
        10px;

      background:
        #e8f5e9;

    }


    .result-title {

      text-align:
        center;

      color:
        #2e7d32;

      font-size:
        13px;

      font-weight:
        bold;

    }


    #result {

      min-height:
        38px;

      margin-top:
        6px;

      text-align:
        center;

      color:
        #111111;

      font-size:
        30px;

      font-weight:
        bold;

      letter-spacing:
        1px;

    }


    #confirmation {

      margin-top:
        5px;

      text-align:
        center;

      color:
        #555555;

      font-size:
        13px;

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    button {

      width:
        100%;

      margin-top:
        12px;

      padding:
        14px;

      border:
        none;

      border-radius:
        10px;

      color:
        #ffffff;

      font-size:
        17px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    button:disabled {

      background:
        #aaaaaa !important;

      cursor:
        not-allowed;

    }


    #startButton {

      background:
        #1976d2;

    }


    #nextButton {

      background:
        #2e7d32;

    }


    #stopButton {

      background:
        #555555;

    }


    #torchButton {

      background:
        #f57c00;

    }


    #torchButton.active {

      background:
        #ff9800;

    }


    /* =====================================================
       INSTRUCTIONS
       ===================================================== */

    .rules {

      margin-top:
        12px;

      padding:
        11px;

      border-radius:
        9px;

      background:
        #f1f3f4;

      color:
        #555555;

      text-align:
        center;

      font-size:
        12px;

      line-height:
        1.45;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (
      max-width: 600px
    ) {

      body {

        padding:
          8px;

      }


      .container {

        padding:
          12px;

        border-radius:
          13px;

      }


      h1 {

        font-size:
          23px;

      }


      #reader {

        min-height:
          270px;

      }


      #result {

        font-size:
          27px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <h1>
    📷 KA Barcode Scanner
  </h1>


  <p class="description">

    Point the camera at the barcode.

    <br>

    <strong>CODE 128</strong> only.

    <br>

    You do not need to perfectly center the barcode.

  </p>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div class="camera-wrapper">


    <div id="reader"></div>


    <!--
      VISUAL GUIDE ONLY.

      It does NOT control the decoder.
    -->

    <div class="scan-guide">

      <div class="scan-line"></div>

      <div class="scan-label">

        POINT BARCODE HERE

      </div>

    </div>


  </div>


  <!-- =====================================================
       CAMERA INFO
       ===================================================== -->

  <div
    id="cameraInfo"
    class="camera-info">

    Camera not started.

  </div>


  <!-- =====================================================
       STATUS
       ===================================================== -->

  <div
    id="status"
    class="status">

    Press START CAMERA.

  </div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div class="result">


    <div class="result-title">

      SCANNED ITEM CODE

    </div>


    <div id="result">

      Waiting...

    </div>


    <div id="confirmation">

      No barcode confirmed yet.

    </div>


  </div>


  <!-- =====================================================
       START
       ===================================================== -->

  <button
    id="startButton"
    onclick="startScanner()">

    START CAMERA

  </button>


  <!-- =====================================================
       TORCH
       ===================================================== -->

  <button
    id="torchButton"
    onclick="toggleTorch()"
    disabled>

    🔦 TURN ON LIGHT

  </button>


  <!-- =====================================================
       STOP
       ===================================================== -->

  <button
    id="stopButton"
    onclick="stopScanner()"
    disabled>

    STOP CAMERA

  </button>


  <!-- =====================================================
       NEXT ITEM
       ===================================================== -->

  <button
    id="nextButton"
    onclick="scanNextItem()">

    🔄 SCAN NEXT ITEM

  </button>


  <!-- =====================================================
       RULES
       ===================================================== -->

  <div class="rules">

    Example:

    <strong>KA7195</strong>

    &nbsp;•&nbsp;

    <strong>KA9876</strong>

    <br>

    Barcode type:

    <strong>CODE 128</strong>

  </div>


</div>



<script>


/****************************************************************
 * ==============================================================
 * GLOBAL STATE
 * ==============================================================
 */


let scanner = null;

let scannerRunning = false;

let scannerStarting = false;

let itemConfirmed = false;


/*
 * Confirmation.
 *
 * We use TWO matching successful reads.
 *
 * This is faster than the previous three-read system.
 */

let confirmationCount = 0;


/*
 * Last barcode seen.
 */

let lastReadValue = "";


/*
 * Last time the barcode was accepted.
 */

let lastAcceptedReadTime = 0;


/*
 * Prevent duplicate callbacks from one instant.
 */

const READ_COOLDOWN = 120;


/*
 * Camera track.
 */

let videoTrack = null;


/*
 * Torch state.
 */

let torchOn = false;


/****************************************************************
 * ==============================================================
 * ITEM CODE FORMAT
 * ==============================================================
 *
 * Your inventory codes:
 *
 * KA7195
 * KA9876
 * etc.
 *
 ****************************************************************/

const ITEM_CODE_PATTERN =
  /^KA\d+$/;


/****************************************************************
 * ==============================================================
 * CAMERA SETTINGS
 * ==============================================================
 *
 * We previously confirmed that your phone can provide:
 *
 * 1080 × 1920
 * 30 FPS
 *
 * We request high quality.
 *
 * We intentionally DO NOT force 1.5× zoom.
 *
 * Digital zoom can enlarge blur instead of giving
 * the decoder more useful barcode pixels.
 *
 ****************************************************************/

const CAMERA_WIDTH =
  1080;

const CAMERA_HEIGHT =
  1920;

const CAMERA_FPS =
  30;


/****************************************************************
 * ==============================================================
 * START SCANNER
 * ==============================================================
 */

async function startScanner() {


  /*
   * Prevent double start.
   */

  if (
    scannerRunning ||
    scannerStarting
  ) {

    return;

  }


  /*
   * Don't start another scan while an item
   * is already confirmed.
   */

  if (
    itemConfirmed
  ) {

    setStatus(

      "Item already confirmed. " +
      "Press SCAN NEXT ITEM.",

      "success"

    );

    return;

  }


  scannerStarting =
    true;


  document
    .getElementById(
      "startButton"
    )
    .disabled =
    true;


  setStatus(

    "Starting camera...",

    ""

  );


  try {


    /************************************************************
     * CLEAN OLD INSTANCE
     ************************************************************/

    await cleanupScanner();


    /*
     * Clear old camera HTML.
     */

    document
      .getElementById(
        "reader"
      )
      .innerHTML = "";


    /************************************************************
     * CREATE HTML5-QRCODE
     ************************************************************/

    scanner =

      new Html5Qrcode(

        "reader",

        {

          /*
           * IMPORTANT:
           *
           * Code 128 ONLY.
           *
           * This reduces unnecessary decoder work.
           */

          formatsToSupport: [

            Html5QrcodeSupportedFormats
              .CODE_128

          ],


          /*
           * Use the browser's native BarcodeDetector
           * when the browser supports it.
           *
           * html5-qrcode falls back when it isn't available.
           */

          useBarCodeDetectorIfSupported:
            true,


          verbose:
            false

        }

      );


    /************************************************************
     * SCANNER CONFIGURATION
     ************************************************************/

    const scanConfig = {

      /*
       * Faster than the original tutorial's 10 FPS.
       *
       * 20 is our target.
       */

      fps:
        20,


      /*
       * VERY IMPORTANT:
       *
       * NO QRBOX.
       *
       * This means we are NOT restricting the decoder
       * to a small square.
       *
       * The entire camera frame is available.
       */


      /*
       * Standard phone camera aspect ratio.
       */

      aspectRatio:
        16 / 9,


      /*
       * Barcode is not mirrored.
       */

      disableFlip:
        true,


      /*
       * Request high-resolution rear camera.
       *
       * Focus is intentionally NOT forced.
       */

      videoConstraints: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          ideal:
            CAMERA_WIDTH

        },

        height: {

          ideal:
            CAMERA_HEIGHT

        },

        frameRate: {

          ideal:
            CAMERA_FPS,

          max:
            CAMERA_FPS

        }

      }

    };


    /************************************************************
     * START
     ************************************************************/

    await scanner.start(

      {

        facingMode: {

          ideal:
            "environment"

        }

      },

      scanConfig,


      /*
       * SUCCESS
       */

      function(
        decodedText,
        decodedResult
      ) {

        handleBarcode(

          decodedText,

          decodedResult

        );

      },


      /*
       * ERROR
       *
       * This callback fires constantly when a frame
       * does not contain a decodable barcode.
       *
       * DO NOT display errors here.
       */

      function(
        errorMessage
      ) {

        /*
         * Intentionally ignored.
         */

      }

    );


    scannerRunning =
      true;


    scannerStarting =
      false;


    /************************************************************
     * GET ACTUAL VIDEO TRACK
     ************************************************************/

    await findVideoTrack();


    /************************************************************
     * DISPLAY ACTUAL CAMERA SETTINGS
     ************************************************************/

    updateCameraInfo();


    /************************************************************
     * SHORT CAMERA SETTLE PERIOD
     *
     * We don't force autofocus.
     *
     * We simply give the phone's camera a moment
     * before the user starts moving the label around.
     ************************************************************/

    setStatus(

      "🔎 CAMERA SETTLING...",

      "ready"

    );


    await sleep(
      600
    );


    updateCameraInfo();


    /************************************************************
     * READY
     ************************************************************/

    setStatus(

      "📷 READY — POINT AT ANY PART OF THE BARCODE",

      "ready"

    );


    document
      .getElementById(
        "stopButton"
      )
      .disabled =
      false;


    /*
     * Check flashlight.
     */

    updateTorchButton();


  }


  catch (error) {


    console.error(
      "Scanner start error:",
      error
    );


    scannerStarting =
      false;


    scannerRunning =
      false;


    await cleanupScanner();


    document
      .getElementById(
        "startButton"
      )
      .disabled =
      false;


    document
      .getElementById(
        "stopButton"
      )
      .disabled =
      true;


    setStatus(

      "❌ CAMERA ERROR: " +
      (
        error.message ||
        error
      ),

      "error"

    );

  }

}


/****************************************************************
 * ==============================================================
 * FIND VIDEO TRACK
 * ==============================================================
 */

async function findVideoTrack() {


  videoTrack =
    null;


  const reader =
    document.getElementById(
      "reader"
    );


  /*
   * Wait up to two seconds for html5-qrcode
   * to attach its video stream.
   */

  for (
    let i = 0;
    i < 20;
    i++
  ) {


    const video =
      reader.querySelector(
        "video"
      );


    if (
      video &&
      video.srcObject
    ) {


      const tracks =
        video.srcObject
          .getVideoTracks();


      if (
        tracks.length > 0
      ) {

        videoTrack =
          tracks[0];


        console.log(
          "Active camera track:",
          videoTrack
        );


        return;

      }

    }


    await sleep(
      100
    );

  }


  console.warn(
    "Video track was not found."
  );

}


/****************************************************************
 * ==============================================================
 * CAMERA INFORMATION
 * ==============================================================
 */

function updateCameraInfo() {


  const info =
    document.getElementById(
      "cameraInfo"
    );


  try {


    if (
      !videoTrack
    ) {

      info.textContent =
        "Camera starting...";

      return;

    }


    const settings =
      videoTrack.getSettings();


    const width =
      settings.width ||
      "?";


    const height =
      settings.height ||
      "?";


    const fps =
      settings.frameRate

        ? Math.round(
            settings.frameRate
          )

        : "?";


    const zoom =
      settings.zoom

        ? Number(
            settings.zoom
          ).toFixed(1) + "×"

        : "native";


    info.innerHTML =

      "<strong>" +

      escapeHtml(

        videoTrack.label ||
        "Rear camera"

      ) +

      "</strong>" +

      "<br>" +

      "Camera: " +

      width +

      " × " +

      height +

      " | " +

      fps +

      " FPS" +

      " | Zoom: " +

      zoom +

      "<br>" +

      "Decoder: CODE 128 only";

  }


  catch (error) {


    console.warn(
      "Camera info error:",
      error
    );


    info.textContent =
      "Rear camera active.";

  }

}


/****************************************************************
 * ==============================================================
 * HANDLE BARCODE
 * ==============================================================
 */

function handleBarcode(

  decodedText,

  decodedResult

) {


  /*
   * Ignore anything after confirmation.
   */

  if (
    itemConfirmed
  ) {

    return;

  }


  /*
   * Clean result.
   */

  const value =

    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (
    !value
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * Prevent duplicate callback bursts.
   */

  if (

    value === lastReadValue &&

    (
      now -
      lastAcceptedReadTime
    ) < READ_COOLDOWN

  ) {

    return;

  }


  lastAcceptedReadTime =
    now;


  console.log(
    "BARCODE DETECTED:",
    value,

    decodedResult
  );


  /**************************************************************
   * VALIDATE ITEM CODE
   **************************************************************/

  if (
    !ITEM_CODE_PATTERN.test(
      value
    )
  ) {

    console.log(
      "Barcode rejected:",
      value
    );

    return;

  }


  /**************************************************************
   * MATCHING READS
   **************************************************************/

  if (
    value === lastReadValue
  ) {

    confirmationCount++;

  }

  else {

    lastReadValue =
      value;

    confirmationCount =
      1;

  }


  /**************************************************************
   * SHOW RESULT IMMEDIATELY
   **************************************************************/

  document
    .getElementById(
      "result"
    )
    .textContent =
    value;


  document
    .getElementById(
      "confirmation"
    )
    .textContent =

    "Verification " +

    confirmationCount +

    " / 2";


  setStatus(

    "Reading " +

    value +

    " — " +

    confirmationCount +

    " / 2",

    ""

  );


  /**************************************************************
   * CONFIRM AFTER TWO MATCHING READS
   **************************************************************/

  if (
    confirmationCount >= 2
  ) {

    confirmBarcode(
      value
    );

  }

}


/****************************************************************
 * ==============================================================
 * CONFIRM BARCODE
 * ==============================================================
 */

async function confirmBarcode(
  value
) {


  if (
    itemConfirmed
  ) {

    return;

  }


  itemConfirmed =
    true;


  document
    .getElementById(
      "result"
    )
    .textContent =
    value;


  document
    .getElementById(
      "confirmation"
    )
    .textContent =
    "✓ BARCODE VERIFIED";


  setStatus(

    "✅ " +
    value +
    " VERIFIED",

    "success"

  );


  /*
   * Stop camera to prevent another item from
   * being accidentally captured.
   */

  await stopScanner();


  /*
   * Keep the confirmed result visible.
   */

  document
    .getElementById(
      "result"
    )
    .textContent =
    value;


  document
    .getElementById(
      "confirmation"
    )
    .textContent =
    "✓ BARCODE VERIFIED — READY FOR NEXT ITEM";

}


/****************************************************************
 * ==============================================================
 * STOP SCANNER
 * ==============================================================
 */

async function stopScanner() {


  scannerRunning =
    false;


  scannerStarting =
    false;


  try {


    if (
      scanner
    ) {

      /*
       * html5-qrcode officially exposes stop()
       * for ending camera scanning.
       */

      await scanner.stop();

    }

  }

  catch (error) {

    console.warn(
      "Scanner stop:",
      error
    );

  }


  try {


    if (
      scanner
    ) {

      scanner.clear();

    }

  }

  catch (error) {

    console.warn(
      "Scanner clear:",
      error
    );

  }


  /*
   * Explicitly stop any remaining video tracks.
   */

  try {


    if (
      videoTrack
    ) {

      videoTrack.stop();

    }

  }

  catch (error) {

    console.warn(
      "Video track stop:",
      error
    );

  }


  scanner =
    null;


  videoTrack =
    null;


  torchOn =
    false;


  document
    .getElementById(
      "reader"
    )
    .innerHTML = "";


  document
    .getElementById(
      "startButton"
    )
    .disabled =
    itemConfirmed;


  document
    .getElementById(
      "stopButton"
    )
    .disabled =
    true;


  document
    .getElementById(
      "torchButton"
    )
    .disabled =
    true;


  document
    .getElementById(
      "torchButton"
    )
    .textContent =
    "🔦 TURN ON LIGHT";


  document
    .getElementById(
      "torchButton"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "cameraInfo"
    )
    .textContent =
    "Camera stopped.";

}


/****************************************************************
 * ==============================================================
 * SCAN NEXT ITEM
 * ==============================================================
 */

async function scanNextItem() {


  /*
   * Stop anything still running.
   */

  await stopScanner();


  /*
   * Clear previous result.
   */

  itemConfirmed =
    false;


  confirmationCount =
    0;


  lastReadValue =
    "";


  lastAcceptedReadTime =
    0;


  torchOn =
    false;


  document
    .getElementById(
      "result"
    )
    .textContent =
    "Waiting...";


  document
    .getElementById(
      "confirmation"
    )
    .textContent =
    "Point at the next barcode.";


  document
    .getElementById(
      "cameraInfo"
    )
    .textContent =
    "Preparing next scan...";


  document
    .getElementById(
      "startButton"
    )
    .disabled =
    false;


  document
    .getElementById(
      "nextButton"
    )
    .disabled =
    false;


  setStatus(

    "Ready for next item.",

    ""

  );


  /*
   * Start immediately.
   *
   * This makes the workflow:
   *
   * Scan → Confirm → Next Item → Camera.
   */

  await startScanner();

}


/****************************************************************
 * ==============================================================
 * TORCH
 * ==============================================================
 */

function updateTorchButton() {


  const button =
    document.getElementById(
      "torchButton"
    );


  if (
    !videoTrack
  ) {

    button.disabled =
      true;

    return;

  }


  if (
    typeof videoTrack.getCapabilities !==
    "function"
  ) {

    button.disabled =
      true;

    button.textContent =
      "🔦 LIGHT NOT AVAILABLE";

    return;

  }


  try {


    const capabilities =
      videoTrack
        .getCapabilities();


    if (
      capabilities &&
      capabilities.torch
    ) {

      button.disabled =
        false;

      button.textContent =

        torchOn

          ? "🔦 TURN OFF LIGHT"

          : "🔦 TURN ON LIGHT";

    }

    else {

      button.disabled =
        true;

      button.textContent =
        "🔦 LIGHT NOT AVAILABLE";

    }

  }

  catch (error) {

    button.disabled =
      true;

  }

}


/****************************************************************
 * ==============================================================
 * TOGGLE TORCH
 * ==============================================================
 */

async function toggleTorch() {


  if (
    !videoTrack
  ) {

    return;

  }


  try {


    const capabilities =
      videoTrack
        .getCapabilities();


    if (
      !capabilities.torch
    ) {

      return;

    }


    torchOn =
      !torchOn;


    await videoTrack
      .applyConstraints({

        advanced: [

          {

            torch:
              torchOn

          }

        ]

      });


    const button =
      document.getElementById(
        "torchButton"
      );


    button.textContent =

      torchOn

        ? "🔦 TURN OFF LIGHT"

        : "🔦 TURN ON LIGHT";


    button.classList.toggle(

      "active",

      torchOn

    );


  }

  catch (error) {


    console.warn(
      "Torch error:",
      error
    );


    torchOn =
      false;

  }

}


/****************************************************************
 * ==============================================================
 * CLEANUP
 * ==============================================================
 */

async function cleanupScanner() {


  try {


    if (
      scanner
    ) {

      try {

        await scanner.stop();

      }

      catch (error) {

        console.warn(
          "Cleanup stop:",
          error
        );

      }


      try {

        scanner.clear();

      }

      catch (error) {

        console.warn(
          "Cleanup clear:",
          error
        );

      }

    }

  }

  catch (error) {

    console.warn(
      "Cleanup error:",
      error
    );

  }


  /*
   * Stop remaining camera tracks.
   */

  try {


    if (
      videoTrack
    ) {

      videoTrack.stop();

    }

  }

  catch (error) {

    console.warn(
      "Cleanup track:",
      error
    );

  }


  scanner =
    null;


  videoTrack =
    null;


  scannerRunning =
    false;

}


/****************************************************************
 * ==============================================================
 * STATUS
 * ==============================================================
 */

function setStatus(
  message,
  type
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status";


  if (
    type
  ) {

    status.classList.add(
      type
    );

  }

}


/****************************************************************
 * ==============================================================
 * SLEEP
 * ==============================================================
 */

function sleep(
  milliseconds
) {

  return new Promise(

    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }

  );

}


/****************************************************************
 * ==============================================================
 * HTML ESCAPE
 * ==============================================================
 */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
