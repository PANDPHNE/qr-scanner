<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Inventory Barcode Scanner</title>


  <!-- Official html5-qrcode library -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #0b0b0d;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

    }


    body {

      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom)
        0;

    }


    /* =====================================================
       MAIN APP
       ===================================================== */

    .app {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      min-height: 100vh;

      background: #0b0b0d;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      padding:
        18px
        18px
        12px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 700;

      letter-spacing: .3px;

    }


    .header p {

      margin:
        5px
        0
        0;

      color: #a8a8ad;

      font-size: 13px;

    }


    /* =====================================================
       SCANNER AREA
       ===================================================== */

    .scanner-card {

      margin:
        0
        10px;

      overflow: hidden;

      border-radius: 18px;

      background: #111114;

      border:
        1px solid
        rgba(255,255,255,.08);

    }


    /*
     * html5-qrcode creates the camera interface
     * inside this element.
     */

    #reader {

      width: 100%;

      background: #000;

    }


    /*
     * Make the camera preview fill the available width.
     */

    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block !important;

      object-fit: cover !important;

    }


    /*
     * Remove unnecessary margins that the library
     * can create around the scanner.
     */

    #reader__scan_region {

      width: 100% !important;

      min-height: 320px;

      background: #000 !important;

    }


    /*
     * Hide the large default "camera scan" text.
     * We keep the actual scanner controls.
     */

    #reader__scan_region img {

      max-width: 100%;

    }


    /* =====================================================
       LIBRARY UI CLEANUP
       ===================================================== */


    /*
     * We only want CAMERA scanning.
     *
     * The file picker is disabled through configuration,
     * but these styles are additional protection.
     */

    #html5-qrcode-button-file-selection {

      display: none !important;

    }


    /*
     * Hide "Scan an image file" elements if generated.
     */

    #reader__dashboard_section_csr
    > div:last-child {

      display: none !important;

    }


    /*
     * Dashboard styling.
     */

    #reader__dashboard {

      padding:
        12px
        12px
        16px !important;

      background:
        #111114 !important;

      color:
        #ffffff !important;

    }


    #reader__dashboard_section {

      width: 100% !important;

    }


    #reader__dashboard_section_csr {

      width: 100% !important;

    }


    /*
     * Camera selection.
     */

    #reader__camera_selection {

      width: 100% !important;

      max-width: 100% !important;

      padding: 10px !important;

      border-radius: 10px;

      background: #1b1b1f;

      color: #fff;

      border:
        1px solid
        #333;

    }


    /*
     * Buttons generated by html5-qrcode.
     */

    #reader button {

      min-height: 45px;

      border: none !important;

      border-radius: 10px !important;

      background:
        #10b981 !important;

      color: #ffffff !important;

      font-size: 15px !important;

      font-weight: 700 !important;

      padding:
        10px
        18px !important;

    }


    #reader button:hover {

      background:
        #0ea574 !important;

    }


    /*
     * Library status text.
     */

    #reader span {

      color: #c9c9ce;

    }


    /* =====================================================
       RESULT PANEL
       ===================================================== */

    .result-panel {

      margin:
        12px
        10px
        0;

      padding:
        18px;

      border-radius: 18px;

      background:
        #151519;

      border:
        1px solid
        rgba(255,255,255,.08);

    }


    .result-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 14px;

    }


    .result-title {

      font-size: 17px;

      font-weight: 700;

    }


    .result-status {

      padding:
        5px
        9px;

      border-radius: 20px;

      background:
        #222328;

      color:
        #999ba2;

      font-size: 11px;

      font-weight: 700;

    }


    .result-status.detected {

      background:
        #063d2c;

      color:
        #34d399;

    }


    .item-code-box {

      padding:
        20px
        12px;

      border-radius: 14px;

      background:
        #0e0e11;

      border:
        1px solid
        #29292e;

      text-align: center;

    }


    .item-code-label {

      color:
        #8f9097;

      font-size: 11px;

      font-weight: 700;

      letter-spacing:
        1px;

      text-transform:
        uppercase;

    }


    #itemCode {

      margin-top:
        7px;

      color:
        #ffffff;

      font-size:
        38px;

      line-height:
        1.1;

      font-weight:
        800;

      letter-spacing:
        2px;

      word-break:
        break-all;

    }


    .scan-details {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        10px;

      margin-top:
        12px;

    }


    .detail {

      padding:
        12px;

      border-radius:
        10px;

      background:
        #1d1d22;

    }


    .detail-label {

      color:
        #888990;

      font-size:
        10px;

      text-transform:
        uppercase;

      font-weight:
        700;

    }


    .detail-value {

      margin-top:
        4px;

      color:
        #ffffff;

      font-size:
        14px;

      font-weight:
        700;

    }


    /* =====================================================
       SCAN ANOTHER
       ===================================================== */

    #scanAgain {

      width:
        100%;

      margin-top:
        14px;

      padding:
        16px;

      border:
        none;

      border-radius:
        14px;

      background:
        #10b981;

      color:
        #ffffff;

      font-size:
        18px;

      font-weight:
        800;

      cursor:
        pointer;

      box-shadow:
        0
        4px
        16px
        rgba(16,185,129,.20);

    }


    #scanAgain:active {

      transform:
        scale(.99);

    }


    #scanAgain:hover {

      background:
        #0ea574;

    }


    /* =====================================================
       WAITING STATE
       ===================================================== */

    .waiting {

      text-align:
        center;

      padding:
        14px
        5px
        2px;

      color:
        #777980;

      font-size:
        12px;

    }


    /* =====================================================
       GREEN DETECTION EFFECT
       ===================================================== */

    .result-panel.detected {

      border-color:
        #10b981;

      box-shadow:
        0
        0
        25px
        rgba(16,185,129,.14);

      animation:
        resultPulse
        .35s
        ease;

    }


    @keyframes resultPulse {

      0% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.012);

      }

      100% {

        transform:
          scale(1);

      }

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (
      max-width: 600px
    ) {

      .header h1 {

        font-size:
          21px;

      }


      #reader__scan_region {

        min-height:
          300px;

      }


      #itemCode {

        font-size:
          34px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ===================================================
       HEADER
       =================================================== -->

  <div class="header">

    <h1>
      📷 Inventory Scanner
    </h1>

    <p>
      Scan the barcode to identify the item
    </p>

  </div>


  <!-- ===================================================
       CAMERA
       =================================================== -->

  <div class="scanner-card">

    <div id="reader"></div>

  </div>


  <!-- ===================================================
       RESULT
       =================================================== -->

  <div
    id="resultPanel"
    class="result-panel">


    <div class="result-header">

      <div class="result-title">
        Scan Result
      </div>

      <div
        id="resultStatus"
        class="result-status">

        READY

      </div>

    </div>


    <div class="item-code-box">

      <div class="item-code-label">

        Item Code

      </div>


      <div id="itemCode">

        —

      </div>

    </div>


    <div class="scan-details">


      <div class="detail">

        <div class="detail-label">
          Barcode Format
        </div>

        <div
          id="barcodeFormat"
          class="detail-value">

          —

        </div>

      </div>


      <div class="detail">

        <div class="detail-label">
          Status
        </div>

        <div
          id="scanStatus"
          class="detail-value">

          Waiting

        </div>

      </div>


    </div>


    <div
      id="waitingText"
      class="waiting">

      Point the rear camera at a Code 128 barcode.

    </div>


    <button
      id="scanAgain"
      onclick="scanAgain()">

      SCAN ANOTHER

    </button>


  </div>


</div>



<script>


/* ============================================================
   SCANNER CONFIGURATION
   ============================================================ */


/*
 * IMPORTANT:
 *
 * We use the official high-level scanner UI.
 *
 * This is intentionally much closer to ScanApp's
 * architecture than our previous custom camera engine.
 */


/*
 * Only Code 128 is needed for your inventory labels.
 */

const formatsToSupport = [

  Html5QrcodeSupportedFormats.CODE_128

];


/*
 * Scanner configuration.
 */

const scannerConfig = {


  /*
   * 15 scans per second.
   *
   * This matches the fast historical version
   * we tested successfully.
   */

  fps: 15,


  /*
   * Wide barcode-shaped scan region.
   *
   * The official documentation explicitly supports
   * rectangular qrbox dimensions such as 400 x 150.
   */

  qrbox: {

    width: 400,

    height: 150

  },


  /*
   * Remember the camera that the user selected.
   */

  rememberLastUsedCamera: true,


  /*
   * Camera scanning ONLY.
   *
   * We don't need image-file scanning for inventory.
   */

  supportedScanTypes: [

    Html5QrcodeScanType.SCAN_TYPE_CAMERA

  ],


  /*
   * Only decode Code 128.
   */

  formatsToSupport:
    formatsToSupport,


  /*
   * Let the library provide the torch
   * button when the Samsung/browser supports it.
   */

  showTorchButtonIfSupported:
    true

};



/* ============================================================
   CREATE OFFICIAL SCANNER UI
   ============================================================ */


const html5QrcodeScanner =

  new Html5QrcodeScanner(

    "reader",

    scannerConfig,

    false

  );



/* ============================================================
   SCAN SUCCESS
   ============================================================ */


function onScanSuccess(

  decodedText,

  decodedResult

) {


  /*
   * Get decoded item code.
   */

  const itemCode =

    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!itemCode) {

    return;

  }


  console.log(
    "CODE DETECTED:",
    itemCode
  );


  console.log(
    "FULL SCAN RESULT:",
    decodedResult
  );


  /*
   * Display item code.
   */

  document
    .getElementById(
      "itemCode"
    )
    .textContent =
    itemCode;


  /*
   * Format.
   *
   * Because we restrict the scanner to CODE_128,
   * this should be CODE_128.
   */

  document
    .getElementById(
      "barcodeFormat"
    )
    .textContent =
    "CODE_128";


  /*
   * Update status.
   */

  document
    .getElementById(
      "scanStatus"
    )
    .textContent =
    "Detected";


  document
    .getElementById(
      "resultStatus"
    )
    .textContent =
    "✓ DETECTED";


  document
    .getElementById(
      "resultStatus"
    )
    .classList
    .add(
      "detected"
    );


  /*
   * Green result effect.
   */

  document
    .getElementById(
      "resultPanel"
    )
    .classList
    .add(
      "detected"
    );


  /*
   * Change instruction.
   */

  document
    .getElementById(
      "waitingText"
    )
    .textContent =
    "Barcode successfully recognized.";


  /*
   * OPTIONAL BACKEND HOOK
   *
   * This is deliberately NOT connected yet.
   *
   * Later we can send itemCode to your
   * Google Apps Script backend here.
   */

  handleInventoryItem(
    itemCode,
    decodedResult
  );

}



/* ============================================================
   SCAN FAILURE
   ============================================================ */


function onScanFailure(
  errorMessage
) {


  /*
   * Do NOT display every failed frame.
   *
   * The scanner will normally fail thousands of
   * frames while searching. Showing those messages
   * would make the UI noisy and slow.
   */

}



/* ============================================================
   RENDER SCANNER
   ============================================================ */


html5QrcodeScanner.render(

  onScanSuccess,

  onScanFailure

);



/* ============================================================
   INVENTORY HANDLER
   ============================================================ */


function handleInventoryItem(

  itemCode,

  decodedResult

) {


  /*
   * For now, simply log the result.
   *
   * This is the exact point where we can connect
   * your Google Apps Script later.
   */

  console.log(
    "Inventory item:",
    itemCode
  );


  /*
   * Example future integration:
   *
   * google.script.run
   *   .withSuccessHandler(...)
   *   .lookupItem(itemCode);
   *
   * OR
   *
   * fetch(YOUR_APPS_SCRIPT_URL, ...)
   *
   * We intentionally leave that out of this
   * camera test.
   */

}



/* ============================================================
   SCAN ANOTHER
   ============================================================ */


function scanAgain() {


  /*
   * Clear the previous result.
   */

  document
    .getElementById(
      "itemCode"
    )
    .textContent =
    "—";


  document
    .getElementById(
      "barcodeFormat"
    )
    .textContent =
    "—";


  document
    .getElementById(
      "scanStatus"
    )
    .textContent =
    "Waiting";


  document
    .getElementById(
      "resultStatus"
    )
    .textContent =
    "READY";


  document
    .getElementById(
      "resultStatus"
    )
    .classList
    .remove(
      "detected"
    );


  document
    .getElementById(
      "resultPanel"
    )
    .classList
    .remove(
      "detected"
    );


  document
    .getElementById(
      "waitingText"
    )
    .textContent =
    "Point the rear camera at a Code 128 barcode.";

}


/* ============================================================
   EXPOSE FOR DEBUGGING
   ============================================================ */


window.inventoryScanner = {

  scanner:
    html5QrcodeScanner,

  scanAgain:
    scanAgain

};


</script>


</body>

</html>
